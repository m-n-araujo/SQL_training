ORDER BY o.order_date;`,checks:[{t:"rows",n:12},{t:"col",c:"running_total"}],hints:["SUM() accumulates, AVG() and COUNT() do not give running totals","OVER needs ORDER BY o.order_date to build up in date order","No PARTITION BY here \u2014 we want one company-wide running total"],solution:"SELECT o.id, o.order_date, ROUND(o.qty * p.price, 2) AS revenue, ROUND(SUM(o.qty * p.price) OVER (ORDER BY o.order_date), 2) AS running_total FROM orders o JOIN products p ON o.product_id = p.id ORDER BY o.order_date;",whyItWorks:"SUM() OVER (ORDER BY date) adds each row's revenue to all previous rows' revenue in date order. Without PARTITION BY, the window spans the entire result \u2014 a single running company total. This is the most common use of window functions in financial reporting."}],usecases:[{co:"atlas",icon:"\u{1F4C8}",title:"Executive Salary Report",situation:"The board wants each employee's salary, their department rank, and how they compare to their department average \u2014 all in one row.",sql:`SELECT e.name, d.name AS dept, e.salary,
  RANK() OVER (PARTITION BY e.dept_id ORDER BY e.salary DESC) AS dept_rank,

 a label 'Above' / 'Below' / 'At' comparing their salary to the department average. Sort by department name then department rank.",tables:["employees","departments"],starter:`-- Use two RANK() calls, one AVG() window function, a JOIN, and a CASE WHEN

ny grows and the average shifts. Someone has to remember to update the query. A scalar subquery \u2014 WHERE salary > (SELECT AVG(salary)) \u2014 updates itself. Every time the query runs, it calculates the current average and uses that. This is the difference between a number in a report that someone has to maintain and a formula that maintains itself."},{icon:"\u{1F517}",title:"Correlated subquery",body:"A correlated subquery references a column from the outer query, re-executing for each outer row. WHERE salary > (SELECT AVG(salary) FROM employees e2 WHERE e2.dept_id = e.dept_id) computes the department average for each individual employee's department. On a 10,000-row table the inner query runs 10,000 times \u2014 powerful but expensive. Window functions with PARTITION BY produce identical results in a single pass and are usually the better choice for large tables.",misconception:"Correlated subqueries can be slow on large tables \u2014 window functions usually replace them more efficiently."},{icon:"\u{1F3D7}\uFE0F",title:"CTE \u2014 Common Table Expression",body:"WITH name AS (SELECT ...) defines a named temporary result that exists for the duration of the statement. The outer query references it like a real table. Chain multiple CTEs by separating them with commas after a single WITH keyword. CTEs make complex queries readable by naming intermediate steps: WITH high_earners AS (SELECT * FROM employees WHERE salary > 90000) SELECT d.name, COUNT(*) FROM high_earners h JOIN departments d ON h.dept_id = d.id GROUP BY d.name. In most engines, CTEs don't improve performance \u2014 their value is readability.",analogy:"Take a query with three nested subqueries inside each other, each one indented further right, each one referencing the result of the one inside it. Now rewrite it with three CTEs \u2014 three named, readable steps at the top, then a clean main query at the bottom. The SQL engine compiles them identically. You get zero performance benefit. What you get is a query your colleague can read in six months without needing you to explain it.",tip:"Think of a CTE as a named temporary view \u2014 it exists only for this query."},{icon:"\u{1F50D}",title:"EXISTS and NOT EXISTS",body:"EXISTS(subquery) returns TRUE if the subquery finds at least one row. NOT EXISTS returns TRUE when no rows match. The subquery's columns don't matter \u2014 only whether any rows exist. EXISTS short-circuits at the first match, making it faster than IN on large tables. NOT IN has a hidden trap: if the subquery returns any NULL, every NOT IN comparison evaluates to UNKNOWN \u2014 effectively returning no rows at all, silently. NOT EXISTS handles NULLs correctly and should be preferred over NOT IN for that reason.",analogy:"NOT IN has a trap: if the subquery returns even one NULL, the entire NOT IN condition silently returns NULL for every row \u2014 meaning you get zero results, no error, no warning. This has caused real data bugs where reports returned nothing and the team assumed the table was empty. NOT EXISTS doesn't have this problem. If you're writing NOT IN (SELECT...), you should almost always be writing NOT EXISTS instead.",tip:"SELECT 1 inside EXISTS is a convention \u2014 EXISTS only cares that rows exist, not what they contain."}],seeit:[{lbl:"Employees earning above company average",ann:"Scalar subquery runs once and substitutes its result into the outer WHERE",sql:`SELECT name, salary
FROM employees

)`}],rules:[{icon:"\u{1F522}",text:"A scalar subquery must return exactly one row and one column \u2014 if it returns multiple rows, the query crashes."},{icon:"\u{1F6AB}",text:"NOT IN is dangerous when the subquery contains any NULL value \u2014 the entire result becomes empty. Use NOT EXISTS instead."},{icon:"\u{1F4CB}",text:"CTEs improve readability and can be referenced multiple times. They do not always improve query performance."}],gotcha:"NOT IN (SELECT customer_id FROM orders) returns zero rows if any customer_id in orders is NULL. Use NOT EXISTS \u2014 it handles NULLs safely."}},{id:"a3",mins:18,title:"UNION, INTERSECT & EXCEPT",tagline:"Combine, compare, and contrast result sets \u2014 SQL's hidden superpower.",hook:{co:"meridian",day:"Wed 11:20",msg:"Can you compare our office cities with our customer cities \u2014 which cities appear in both? And which cities have offices but no customers? I want to spot coverage gaps.",from:"Diya Mehrotra \xB7 People Analytics Lead",insight:"Set operations treat entire result sets like mathematical sets \u2014 combine with UNION, overlap with INTERSECT, subtract with EXCEPT. Powerful, underused, and instantly recognisable in interviews."},concepts:[{icon:"\u222A",title:"UNION \u2014 combine without duplicates",body:"UNION combines two SELECT results into one and removes duplicate rows. Both queries must return the same number of columns, and corresponding columns must have compatible types. Column names come from the first SELECT \u2014 aliases in the second SELECT are ignored. UNION performs an implicit deduplication step that adds processing overhead. Use UNION when genuinely merging two different result sets where duplicates must be eliminated; use UNION ALL when you know duplicates are impossible or should be preserved.",analogy:"UNION doesn't care what your columns are named \u2014 it merges by position. If the first SELECT returns name, revenue and the second SELECT returns city, cost, UNION puts city values in the name column and cost values in the revenue column. No error. Wrong data. The column names in the output come from the first SELECT only. This is the most common UNION mistake and it produces confidently wrong numbers.",tip:"UNION is equivalent to a mathematical set union. ORDER BY must come at the VERY END of a UNION \u2014 not after each individual SELECT.",misconception:"UNION removes duplicates automatically. If you want all rows including duplicates, use UNION ALL \u2014 it is significantly faster."},{icon:"\u2295",title:"UNION ALL \u2014 fast combine with duplicates",body:"UNION ALL appends results from two queries without deduplication \u2014 every row from both appears in the output, including exact duplicates. It is faster than UNION because no sorting or row comparison is needed. Use UNION ALL when combining data from separate periods, regions, or sources where a duplicate row represents a real separate event. Using UNION instead of UNION ALL in those cases silently removes matching rows and can corrupt totals.",analogy:"Using UNION instead of UNION ALL on transaction logs would be like auditing a bank and removing 'duplicate' transactions because the amounts matched. Two customers both paying \xA349.99 on the same day aren't the same transaction \u2014 they're two real payments. UNION ALL says: keep everything. Every row that exists in either result stays in the output. Use UNION only when you've verified that a duplicate row actually is a duplicate thing.",tip:"If combining two tables with no overlapping data, UNION ALL is always the right choice \u2014 UNION would waste time looking for duplicates that cannot exist.",misconception:"UNION ALL does NOT remove duplicates. If the same city appears in both sources, it appears twice. Use UNION when you need unique rows."},{icon:"\u2229",title:"INTERSECT \u2014 rows present in both",body:"INTERSECT returns only rows that appear in both SELECT results. Like UNION, it removes duplicates. Both queries must return the same number of columns with compatible types. It answers 'what do these two groups have in common?': customers who ordered in both 2023 and 2024, products that appear in both the UK and EU catalogues, employees on both lists. INTERSECT is symmetric \u2014 A INTERSECT B equals B INTERSECT A. Less commonly available in some engines than UNION.",analogy:"INTERSECT answers the question: 'who or what appears in both of these groups?' Which products appear in both the UK catalogue and the EU catalogue? Which employees appear on both the 2023 headcount list and the 2024 headcount list \u2014 i.e. who stayed? INTERSECT is the SQL way of finding overlap without a JOIN. It's less common than UNION or EXCEPT, but when the question is 'what do these two groups share?', nothing else reads as clearly.",tip:"INTERSECT is useful for finding shared values: customers who also appear as suppliers, cities that have both offices and customers."},{icon:"\u2212",title:"EXCEPT \u2014 rows in first but not second",body:"EXCEPT returns rows from the first SELECT that do not appear in the second. It is directional \u2014 A EXCEPT B differs from B EXCEPT A. EXCEPT removes duplicates. Use it to find gaps: products never ordered, customers who bought last year but not this year. SELECT id FROM employees EXCEPT SELECT employee_id FROM payroll finds employees missing from payroll. Both queries must return the same number of columns with compatible types.",analogy:"EXCEPT direction matters and it tells you which business question you're asking. 2023 customers EXCEPT 2022 customers = who's new this year. 2022 customers EXCEPT 2023 customers = who churned. Same two tables, opposite query order, completely opposite business meaning. Getting the direction backwards gives you a wrong answer that looks plausible \u2014 the row count might even seem reasonable. Always read EXCEPT as 'A minus B' and check which list is A.",tip:"EXCEPT is ideal for gap analysis: products never ordered, employees with no manager, departments with no staff.",misconception:"EXCEPT is directional \u2014 A EXCEPT B gives different results from B EXCEPT A. The order of the two queries matters."}],seeit:[{lbl:"All unique cities \u2014 departments and customers combined",ann:"UNION merges both lists and removes duplicates \u2014 each city appears once no matter how many times it occurs",sql:`SELECT city FROM departments
UNION
SELECT city FROM customers
ORDER BY city;`},{lbl:"Every city row including duplicates (UNION ALL)",ann:"UNION ALL keeps all rows \u2014 5 from departments plus 5 from customers = 10 rows total, duplicates included",sql:`SELECT city, 'dept' AS source FROM departments
UNION ALL
SELECT city, 'customer' AS source FROM customers
ORDER BY city;`},{lbl:"Cities with both offices AND customers",ann:"INTERSECT keeps only rows that appear in both result sets",sql:`SELECT city FROM departments
INTERSECT
SELECT city FROM customers
ORDER BY city;`},{lbl:"Office cities with no customer presence",ann:"EXCEPT returns rows from the first query absent in the second \u2014 coverage gap analysis",sql:`SELECT city FROM departments

%%D:UNION|UNION ALL|INTERSECT%%

%%D:INTERSECT|UNION|EXCEPT%%

ORDER BY city;`,checks:[{t:"rows",n:2}],hints:["INTERSECT returns only rows present in BOTH queries","Chicago and San Francisco appear in both tables"],solution:"SELECT city FROM departments INTERSECT SELECT city FROM customers ORDER BY city;",whyItWorks:"INTERSECT keeps only rows that exist in both result sets. Chicago and San Francisco each appear in both departments and customers. New York appears only in departments."},{id:"g3",diff:"Medium",title:"Office cities with no customer presence",context:"Sales wants to know which cities have offices but no customer presence \u2014 potential territory expansion targets.",template:`SELECT city FROM departments
%%D:EXCEPT|INTERSECT|UNION%%
SELECT city FROM customers

FROM employees WHERE salary > 85000

ORDER BY value DESC;`,checks:[{t:"rows",n:7},{t:"col",c:"type"}],hints:["label 1: 'Employee'","label 2: 'Product'","UNION combines both lists","Columns must match: name, value, type"],solution:"SELECT name, salary AS value, 'Employee' AS type FROM employees WHERE salary > 85000 UNION SELECT name, price AS value, 'Product' AS type FROM products WHERE price > 500 ORDER BY value DESC;",whyItWorks:"UNION requires matching column count and compatible types. Adding a literal string column tags each row with its source. The result can be sorted, filtered, or paginated as a single unified dataset."}],usecases:[{co:"meridian",icon:"\u{1F5FA}\uFE0F",title:"Geographic Coverage Analysis",situation:"Priya needs to identify which cities have offices only, customers only, and both \u2014 to guide regional expansion planning.",sql:`-- Office cities with no customers
SELECT city, 'Office only' AS status

ORDER BY status, city;`,result:"A Venn diagram in table form: New York as office-only, Boston/Dallas/Springfield as customer-only, Chicago and San Francisco as both.",transferPoint:"Chaining UNION ALL with EXCEPT and INTERSECT creates a three-way segment analysis. Each section is computed independently then stacked."},{co:"atlas",icon:"\u{1F4CA}",title:"Cross-Table High-Value Report",situation:"Vantara Capital is compiling an assets report: all high-salary employees (over $80k) and high-price products (over $400) in one ranked list.",sql:`SELECT name, salary AS value, 'Employee' AS category

ORDER BY value DESC;`,result:"10 rows combining employees and products into one ranked list. The board sees the full asset picture in one view.",transferPoint:"UNION is the cleanest way to combine heterogeneous data into a single report when the columns are compatible. No JOIN needed \u2014 just matching column shapes."}],recall:[{q:"What is the key difference between UNION and UNION ALL?",opts:["UNION keeps duplicates; UNION ALL removes them","UNION ALL keeps duplicates; UNION removes them","UNION requires matching column names; UNION ALL does not","UNION ALL only works on the same table"],ans:1,exp:"UNION removes duplicate rows from the combined result \u2014 it does extra work (sorting or hashing) to find duplicates. UNION ALL keeps all rows including duplicates and is faster. Use UNION when you need unique values; use UNION ALL when duplicates are acceptable or impossible."},{q:"What does EXCEPT return?",opts:["Rows in either query","Rows in both queries","Rows in the first query that are NOT in the second","Rows in the second query that are NOT in the first"],ans:2,exp:"EXCEPT returns rows from the first query that do not appear in the second. It is directional \u2014 A EXCEPT B gives different results from B EXCEPT A. Use it for gap analysis: find things that exist in one set but not another."},{q:"Both SELECT statements in a UNION must have what in common?",opts:["The same table name","The same WHERE conditions","The same number of columns with compatible types","Identical column names"],ans:2,exp:"UNION requires both queries to return the same number of columns with compatible data types. Column names in the result come from the first query \u2014 the second query's column names are ignored. Text and numbers would be incompatible."}],challenge:[{id:"c1",diff:"Expert",title:"Three-Way City Coverage Report",context:"Using UNION, INTERSECT, and EXCEPT, build a report with three categories: cities with offices but no customers labelled 'Dept only', cities with customers but no offices labelled 'Customer only', and cities with both labelled 'Both'. Connect sections with UNION ALL and sort by category then city.",tables:["departments","customers"],starter:`-- Dept cities not in customers

`,checks:[{t:"col",c:"category"}],hints:["UNION ALL","SELECT city, 'Customer only' AS category FROM customers EXCEPT SELECT city, 'Customer only' FROM departments","UNION ALL","SELECT city, 'Both' AS category FROM departments INTERSECT SELECT city, 'Both' FROM customers","ORDER BY category, city"],solution:"SELECT city, 'Dept only' AS category FROM departments EXCEPT SELECT city, 'Dept only' FROM customers UNION ALL SELECT city, 'Customer only' AS category FROM customers EXCEPT SELECT city, 'Customer only' FROM departments UNION ALL SELECT city, 'Both' AS category FROM departments INTERSECT SELECT city, 'Both' FROM customers ORDER BY category, city;",celebration:"Three set operations in one query \u2014 this is a SQL Venn diagram. The same pattern applies to any overlap analysis: products never ordered, customers with no activity, users in one system but not another."}],sheet:{syntax:[{label:"Combine result sets",code:`SELECT name FROM employees

UNION ALL          -- keeps all rows`}],rules:[{icon:"\u{1F4CC}",text:"Both queries must return the same number of columns, and corresponding columns should be compatible types."},{icon:"\u{1F3F7}\uFE0F",text:"Column names in the result come from the first SELECT. Aliases in the second SELECT are ignored."},{icon:"\u26A1",text:"UNION ALL is faster than UNION \u2014 UNION must sort and deduplicate the combined result. Use UNION ALL unless you specifically need deduplication."}],gotcha:"UNION silently removes identical rows. When combining sales data across time periods or regions, use UNION ALL \u2014 otherwise duplicate-looking rows (same amount, different customer) get dropped."}},{id:"a4",mins:20,title:"INSERT, UPDATE & DELETE",tagline:"Write data, not just read it \u2014 the DML skills that round out your toolkit.",hook:{co:"forge",day:"Mon 14:03",msg:"Three quick things: add the new Legal department, apply a 10% raise for Engineering, and remove discontinued products with zero stock. Can you write those three queries?",from:"Rohan Reinholt \xB7 Operations Director",insight:"SELECT reads data. INSERT, UPDATE, and DELETE modify it. Together they are SQL DML \u2014 Data Manipulation Language. Once you know DML, you can build, maintain, and repair a real database."},concepts:[{icon:"\u2795",title:"INSERT INTO \u2014 add new rows",body:"INSERT INTO table (col1, col2) VALUES (val1, val2) adds a new row. Always list column names explicitly \u2014 it makes the insert immune to future column additions or reorderings in the table schema. Insert multiple rows in one statement: VALUES (v1, v2), (v3, v4). INSERT INTO ... SELECT ... inserts the full result of a query, useful for populating summary tables or copying filtered subsets. If a primary key conflict occurs, the insert fails with an error unless you use INSERT OR IGNORE or INSERT OR REPLACE.",tip:"Always specify the column list in INSERT \u2014 if the schema changes, implicit ordering silently inserts values into the wrong columns. Power pattern: INSERT INTO archive SELECT * FROM orders WHERE order_date < '2024-01-01' copies rows from a query directly, no VALUES needed.",analogy:"INSERT assumes the row is new. If a row with the same primary key already exists, INSERT fails with an error \u2014 it won't overwrite silently. In sync jobs and imports where the same data might arrive twice, that's a problem. INSERT OR IGNORE skips duplicates without failing. INSERT OR REPLACE removes the old row and inserts the new one. Knowing which behaviour you want before you write the INSERT is the difference between a reliable pipeline and an intermittently failing one.",misconception:"If you omit a column in INSERT, it receives its default value (often NULL). If that column has a NOT NULL constraint, the insert will fail."},{icon:"\u270F\uFE0F",title:"UPDATE \u2014 modify existing rows",body:"UPDATE table SET col1 = val1, col2 = val2 WHERE condition modifies every row satisfying the condition. Update multiple columns in one statement by separating assignments with commas. The new value can reference the existing value: SET salary = salary * 1.1 applies a 10% raise. Without WHERE, UPDATE modifies every row in the table \u2014 the most common and costly SQL mistake. Before running a large UPDATE, run the equivalent SELECT with the same WHERE to verify how many rows will be affected. Wrap in a transaction to allow rollback.",tip:"Always write the WHERE clause first. Run it as a SELECT to verify which rows will change, then convert to UPDATE.",misconception:"An UPDATE without WHERE updates ALL rows silently \u2014 no warning, no confirmation. This is one of the most dangerous SQL mistakes in production."},{icon:"\u{1F5D1}\uFE0F",title:"DELETE FROM \u2014 remove rows",body:"DELETE FROM table WHERE condition removes every matching row permanently. Without WHERE, it deletes every row in the table \u2014 a full wipe, no recycle bin. Before running DELETE, verify scope: run SELECT COUNT(*) FROM table WHERE condition to confirm the row count, then replace the SELECT with DELETE FROM. Wrapping in BEGIN ... ROLLBACK lets you inspect the effect before committing. Deleted rows cannot be recovered without a backup \u2014 always treat DELETE as irreversible.",tip:"In production, always wrap DELETE and UPDATE in a transaction so you can ROLLBACK if something is wrong.",analogy:"The rule senior engineers follow: never run a DELETE without first running the equivalent SELECT. Write SELECT * FROM orders WHERE customer_id = 99, see seven rows come back, confirm that's what you intended, then change SELECT * to DELETE FROM. The select takes three seconds. Restoring accidentally deleted production data takes hours or days. One habit, ten seconds of effort, zero incidents.",misconception:"DELETE cannot be undone without a transaction or a backup. There is no recycle bin \u2014 the rows are gone."},{icon:"\u{1F512}",title:"BEGIN, COMMIT and ROLLBACK",body:"A transaction groups multiple SQL statements into one atomic unit \u2014 either all changes succeed together, or all are undone. BEGIN (or BEGIN TRANSACTION) starts it. COMMIT makes every change since BEGIN permanent. ROLLBACK cancels all changes since BEGIN, restoring the original state. If any statement fails mid-transaction, ROLLBACK undoes the successful ones too. Use transactions whenever a business operation requires multiple statements to succeed together \u2014 fund transfers, order processing, cascading updates.",tip:"Always use transactions for multi-step DML \u2014 BEGIN/COMMIT/ROLLBACK ensures that all changes succeed or none do. Never run a salary update and a log entry separately."}],seeit:[{lbl:"INSERT \u2014 add a new department",ann:"Column list is explicit: safer and self-documenting. Values match the column order.",sql:`INSERT INTO departments (id, name, city, budget)

COMMIT;`,result:"2 low-stock items removed, Electronics prices reduced 5%, new product added. Final catalogue has 7 rows in a clean state.",transferPoint:"DELETE, UPDATE, and INSERT can be chained in a single transaction. If any step fails, ROLLBACK restores the full original state \u2014 no partial updates reach the database."}],recall:[{q:"An UPDATE without a WHERE clause does what?",opts:["Updates only the first matching row","Updates no rows \u2014 WHERE is required","Updates ALL rows in the table silently","Returns an error asking for WHERE"],ans:2,exp:"Without WHERE, UPDATE modifies every row in the table with no warning. It is legal SQL and executes immediately. Always verify your WHERE clause by running it as a SELECT first, then switch to UPDATE."},{q:"What is the purpose of ROLLBACK in a transaction?",opts:["Saves all changes made since BEGIN","Cancels all changes made since BEGIN and restores the previous state","Deletes the transaction log","Resets the auto-increment counter"],ans:1,exp:"ROLLBACK cancels all changes made since BEGIN, restoring the database to its exact state before the transaction started. COMMIT saves the changes. If you run BEGIN, make changes, then spot an error \u2014 ROLLBACK is your undo button."},{q:"Which is the correct syntax to remove rows matching a condition?",opts:["REMOVE FROM orders WHERE order_date < '2024-01-01'","DELETE orders WHERE order_date < '2024-01-01'","DELETE FROM orders WHERE order_date < '2024-01-01'","DROP orders WHERE order_date < '2024-01-01'"],ans:2,exp:"The correct syntax is DELETE FROM table WHERE condition. DELETE without FROM is invalid. REMOVE is not a SQL keyword. DROP TABLE deletes the entire table structure and all its data \u2014 very different from removing specific rows."}],challenge:[{id:"c1",diff:"Expert",title:"Catalogue Restock and Cleanup",context:"Run three DML operations inside a single transaction: (1) DELETE products with stock <= 0, (2) UPDATE Electronics prices with a 5% discount rounded to 2dp, (3) INSERT a new product: id=9, name='Desk Lamp', category='Accessories', price=34.99, stock=75. End with COMMIT and SELECT all products ordered by category and name.",tables:["products"],starter:`BEGIN;

:root {
  --font-head: "Nunito","Plus Jakarta Sans","Inter",-apple-system,sans-serif;
  --font-ui:   "Plus Jakarta Sans","Inter",-apple-system,sans-serif;
  --font-code: "JetBrains Mono","Fira Code","Cascadia Code",ui-monospace,"Menlo","Consolas",monospace;

  /* Radius scale \u2014 16px cards, 12px inputs/buttons */
  --r-xs:  8px;  --r-sm: 12px;  --r-md: 16px;  --r-lg: 20px;  --r-pill: 99px;

  /* Shadow / glow system \u2014 shadow-first, border-secondary */
  --shadow-card:  0 4px 32px rgba(4,6,18,.55), 0 1px 0 rgba(255,255,255,.04) inset;
  --shadow-hover: 0 8px 48px rgba(4,6,18,.7),  0 0 24px rgba(109,124,255,.08), 0 1px 0 rgba(255,255,255,.05) inset;
  --shadow-glow:  0 4px 24px rgba(109,124,255,.25);
  --shadow-sm:    0 2px 16px rgba(4,6,18,.4);

  --glass:      rgba(11,16,32,.85);
  --glass2:     rgba(17,24,43,.80);
  --glass-brd:  rgba(36,49,79,.55);

  --ease: cubic-bezier(.22,.68,0,1.15);
}

/* \u2500\u2500 Reset \u2500\u2500 */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

/* \u2500\u2500 Base \u2500\u2500 */
body {
  font-family: var(--font-ui);
  background: ${r.bg};
  color: ${r.tx};
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: "kern" 1;
  background-image:
    radial-gradient(rgba(37,99,235,.06) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* \u2500\u2500 Glass card system \u2500\u2500 */
.glass-card {
  background: var(--glass);
  border: 1px solid var(--glass-brd);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.04);
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s;
}
.glass-card:hover {
  transform: translateY(-1px);
  border-color: rgba(74,95,138,.7);
  box-shadow: var(--shadow-hover);
}
.glass-card-sm {
  background: var(--glass2);
  border: 1px solid var(--glass-brd);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-sm);
  transition: transform .2s var(--ease), box-shadow .2s, border-color .2s;
}
.glass-card-sm:hover {
  transform: translateY(-1px);
  border-color: rgba(74,95,138,.7);
  box-shadow: var(--shadow-hover);
}
.glass-flat {
  background: var(--glass2);
  border: 1px solid var(--glass-brd);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-sm);
}

/* \u2500\u2500 Typography \u2500\u2500 */
:where(h1,h2,h3,h4) {
  font-family: var(--font-head);
  text-wrap: balance;
  letter-spacing: -.025em;
}
:where(pre,code,kbd,samp,textarea,input,select) {
  font-family: var(--font-code);
  font-feature-settings: "liga" 0;   /* no ligatures in code */
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}

/* \u2500\u2500 Scrollbars \u2500\u2500 */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: ${r.brd}; border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: ${r.brdBright}; }

/* \u2500\u2500 Forms \u2500\u2500 */
textarea:focus, input:focus, select:focus {
  outline: 2px solid ${r.A};
  outline-offset: 2px;
}
button { cursor: pointer; font-family: var(--font-ui); }
select { font-family: var(--font-code); }

/* \u2500\u2500 Focus management \u2500\u2500 */
/* Mouse users: no visible ring. Keyboard users: high-contrast ring. */
:focus:not(:focus-visible) { outline: none; }
:focus-visible {
  outline: 2px solid ${r.A};
  outline-offset: 3px;
  border-radius: 3px;
}

/* \u2500\u2500 Syntax highlight tokens \u2500\u2500 */
.hkw { color: #7dd3fc; font-weight: 600; }  /* keywords \u2014 electric cyan  */
.hst { color: #6ee7b7; }                     /* strings  \u2014 mint green     */
.hnu { color: #fda4af; }                     /* numbers  \u2014 soft rose      */
.hcm { color: ${r.t3}; font-style: italic; } /* comments                  */

/* \u2500\u2500 Animations \u2500\u2500 */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0);    }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0);     }
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 10px rgba(37,99,235,.3); }
  50%       { box-shadow: 0 0 28px rgba(37,99,235,.55); }
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px) scale(.95); }
  to   { opacity: 1; transform: translateY(0)    scale(1);   }
}
@keyframes spin { to { transform: rotate(360deg); } }

.aUp    { animation: slideUp .32s var(--ease) both; }
.toastIn{ animation: toastIn .4s var(--ease) both; }
/* \u2500\u2500 Answer card: mint glow pulse on correct, rose shake on wrong \u2500\u2500 */
@keyframes flashGreen {
  0%   { box-shadow: var(--shadow-sm); border-color: rgba(36,49,79,.5); }
  30%  { box-shadow: 0 0 0 5px rgba(41,211,145,.28), 0 0 26px rgba(41,211,145,.22); border-color: #29D391; }
  65%  { box-shadow: 0 0 0 2px rgba(41,211,145,.14), 0 0 14px rgba(41,211,145,.14); border-color: #29D391; }
  100% { box-shadow: 0 0 12px rgba(41,211,145,.1); border-color: #29D391; }
}
@keyframes flashRed {
  0%,100% { transform: translateX(0); border-color: rgba(255,107,138,.45); }
  18%  { transform: translateX(-6px); }
  36%  { transform: translateX( 6px); }
  54%  { transform: translateX(-4px); }
  72%  { transform: translateX( 4px); }
  88%  { transform: translateX(-2px); }
}
.ans-correct { animation: flashGreen .52s cubic-bezier(.22,.68,0,1.2) both; }
.ans-wrong   { animation: flashRed   .40s cubic-bezier(.22,.68,0,1.2) both; }

/* \u2500\u2500 Drag-and-drop \u2500\u2500 */
.drag-chip        { cursor: grab; user-select: none; touch-action: none;
                    transition: transform .12s ease, opacity .12s, box-shadow .12s; }
.drag-chip:hover  { transform: translateY(-2px);
                    box-shadow: 0 6px 18px rgba(4,6,18,.5); }
.drag-chip:active { cursor: grabbing; opacity: .68; transform: scale(1.05) translateY(-3px);
                    box-shadow: 0 8px 24px rgba(4,6,18,.6); }
.drop-slot        { transition: background .15s, border-color .15s, transform .12s; }
.drop-slot.over   { background: rgba(37,99,235,.18) !important;
                    border-color: rgba(37,99,235,.6) !important; }

/* \u2500\u2500 Pill select \u2500\u2500 */
.pill-select { transition: background .15s, border-color .15s, color .15s; }
.pill-select:focus-within { outline: 2px solid rgba(34,211,238,.5); outline-offset: 2px; }

/* \u2500\u2500 Step unlock: brief slide-up \u2500\u2500 */
@keyframes stepUnlock {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.step-unlock { animation: stepUnlock .26s cubic-bezier(.22,.68,0,1.15) both; }

/* \u2500\u2500 Lesson completion badge pop \u2500\u2500 */
@keyframes badgePop {
  0%   { transform: scale(.6) rotate(-6deg); opacity: 0; }
  55%  { transform: scale(1.12) rotate(3deg); opacity: 1; }
  80%  { transform: scale(.96) rotate(-1deg); }
  100% { transform: scale(1) rotate(0deg); }
}
@keyframes completionRise {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* \u2500\u2500 Workspace panel: smooth slide up, not pop \u2500\u2500 */
@keyframes backdropFadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes panelSlideIn {
  from { opacity: 0; transform: translate(-50%, calc(-50% + 24px)) scale(.97); }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* \u2500\u2500 Responsive helpers \u2500\u2500 */
@media (min-width: 1400px) {
  .glass-card    { border-radius: 20px; }
  .glass-card-sm { border-radius: 16px; }
}
/* \u2500\u2500 Concept card label chips \u2500\u2500 */
.concept-label {
  display: inline-block;
  font-size: 10px; font-weight: 700;
  letter-spacing: .6px; text-transform: uppercase;
  padding: 2px 7px; border-radius: 4px;
  margin-bottom: 5px;
}
/* \u2500\u2500 Consistent section dividers inside cards \u2500\u2500 */
.card-section + .card-section {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(36,49,79,.3);
}
@media (max-width: 640px)  {
  .hide-sm  { display: none !important; }
  .sm-col   { flex-direction: column !important; }
  .sm-full  { width: 100% !important; }
  .sm-grid1 { grid-template-columns: 1fr !important; }
}
@media (max-width: 900px) {
  .hide-md { display: none !important; }
}

/* \u2500\u2500 Accessibility \u2500\u2500 */
.skip-link {
  position: absolute; top: -48px; left: 0;
  background: ${r.A}; color: ${r.bg};
  padding: 10px 18px; font-weight: 700; font-size: 14px;
  z-index: 9999; border-radius: 0 0 8px 0;
  transition: top .2s;
}
.skip-link:focus { top: 0; }

/* \u2500\u2500 Achievement toast dismiss bar \u2500\u2500 */
@keyframes shrinkBar {
  from { width: 100%; }
  to   { width: 0%;   }
}
@keyframes indeterminateBar {
  0%   { transform: translateX(-100%) scaleX(.3); }
  50%  { transform: translateX(30%)   scaleX(.7); }
  100% { transform: translateX(100%)  scaleX(.3); }
}

/* \u2500\u2500 SQL Playground IDE \u2500\u2500 */
textarea.sql-editor::selection { background: rgba(37,99,235,.22); }
@keyframes rowFadeIn { from{opacity:0;transform:translateX(-6px);} to{opacity:1;transform:translateX(0);} }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }

/* \u2500\u2500 Ticket / scenario cards \u2500\u2500 */
.ticket-card { position: relative; overflow: hidden; }
.ticket-card::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--ticket-accent, rgba(109,124,255,.6));
}
@keyframes urgentPulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }
.badge-urgent { animation: urgentPulse 2s ease infinite; }
