dget"],products:["id","name","category","price","stock"],customers:["id","name","email","city"],orders:["id","customer_id","product_id","qty","order_date"]},Tm={nexus:{name:"Orion Commerce",icon:"\u{1F6D2}",color:r.A,role:"Head of Growth",sender:"Zola Oduya",initials:"ZO",team:"Growth",note:"E-commerce marketplace, 450 employees",urgency:"High",impact:"Revenue & Retention"},meridian:{name:"Crestline Analytics",icon:"\u{1F4CB}",color:r.S,role:"People Analytics Lead",sender:"Diya Mehrotra",initials:"DM",team:"HR Analytics",note:"Data consultancy, 2,800 employees",urgency:"Normal",impact:"Workforce Planning"},atlas:{name:"Vantara Capital",icon:"\u{1F4CA}",color:r.M,role:"Head of Finance",sender:"Camila Ibarra",initials:"CI",team:"Finance BI",note:"Growth equity firm, 320 employees",urgency:"High",impact:"Board Reporting"},forge:{name:"Kestral Logistics",icon:"\u{1F4E6}",color:r.R,role:"Operations Director",sender:"Rohan Reinholt",initials:"RR",team:"Supply Chain Ops",note:"3PL provider, 1,200 employees",urgency:"Urgent",impact:"Operational Efficiency"}},Ag="CREATE TABLE departments(id INT PRIMARY KEY,name TEXT,city TEXT,budget REAL);CREATE TABLE employees(id INT PRIMARY KEY,name TEXT,dept_id INT,salary REAL,hire_date TEXT,manager_id INT);CREATE TABLE products(id INT PRIMARY KEY,name TEXT,category TEXT,price REAL,stock INT);CREATE TABLE customers(id INT PRIMARY KEY,name TEXT,email TEXT,city TEXT);CREATE TABLE orders(id INT PRIMARY KEY,customer_id INT,product_id INT,qty INT,order_date TEXT);",Cg="INSERT INTO departments VALUES(1,'Engineering','San Francisco',900000),(2,'Marketing','New York',400000),(3,'HR','Chicago',260000),(4,'Finance','New York',480000),(5,'Design','San Francisco',310000);INSERT INTO employees VALUES(1,'Mara Osei',1,95000,'2019-03-15',NULL),(2,'Kofi Adeyemi',1,82000,'2020-07-01',1),(3,'Vesper Voss',2,71000,'2018-11-20',NULL),(4,'Kenji Tanaka',1,110000,'2017-01-10',1),(5,'Jade Brennan',3,58000,'2021-04-05',NULL),(6,'Leila Farouk',4,89000,'2019-09-12',NULL),(7,'Amara Reyes',5,76000,'2020-02-28',NULL),(8,'Remi Laurent',2,65000,'2022-01-15',3),(9,'Faye Okonkwo',1,91000,'2018-06-30',1),(10,'Luca Ferraro',4,78000,'2021-08-22',6),(11,'Wren Matsuda',3,54000,'2023-03-01',5),(12,'Nico Espinoza',5,83000,'2019-12-10',7);INSERT INTO products VALUES(1,'Laptop Pro','Electronics',1299.99,45),(2,'Wireless Mouse','Electronics',39.99,200),(3,'Standing Desk','Furniture',549.00,30),(4,'Ergonomic Chair','Furniture',799.00,25),(5,'Monitor 27in','Electronics',429.99,60),(6,'Mech Keyboard','Electronics',149.99,80),(7,'Notebook Set','Stationery',24.99,500),(8,'HD Webcam','Electronics',89.99,120);INSERT INTO customers VALUES(1,'Starfall Systems','info@starfall.io','Boston'),(2,'Peloro Co','hello@peloro.co','Chicago'),(3,'Neon Digital','ops@neondigital.dev','Dallas'),(4,'Luminos Labs','lab@luminos.io','San Francisco'),(5,'Halcyon Ltd','info@halcyon.net','Springfield');INSERT INTO orders VALUES(1,1,1,3,'2024-01-15'),(2,2,3,1,'2024-01-18'),(3,1,5,2,'2024-02-03'),(4,3,2,5,'2024-02-10'),(5,4,4,2,'2024-02-14'),(6,2,6,3,'2024-03-01'),(7,5,7,10,'2024-03-05'),(8,1,8,4,'2024-03-12'),(9,3,1,1,'2024-03-20'),(10,4,2,8,'2024-04-01'),(11,5,5,1,'2024-04-08'),(12,2,7,20,'2024-04-15');",Ue=[{level:"Beginner",icon:"\u2726",color:"#6D7CFF",modules:[{id:"b1",mins:10,title:"SELECT & FROM",tagline:"Your first SQL query \u2014 retrieve any data in seconds",hook:{co:"nexus",day:"Mon 09:04",msg:"Hey! Quick favour \u2014 can you pull a list of all employees with their names and salaries? Board meeting at 10.",from:"Zola Oduya \xB7 Head of Growth",insight:"This is the most common SQL task in any data role. You will write SELECT + FROM dozens of times every week \u2014 it takes ten seconds to learn and a lifetime to master."},concepts:[{icon:"\u{1F5C4}\uFE0F",title:"What is a database?",body:"A relational database stores data in tables \u2014 two-dimensional grids where every row is one record and every column holds one attribute. Related tables link through shared key values: an orders table stores customer_id, not the customer's full details. That separation avoids repetition and makes updates safe. SQL (Structured Query Language) is the standard language for querying, inserting, updating, and deleting data in these tables. Every query you write is a precise instruction to the database engine.",analogy:"Imagine running a business where every order form also includes the customer's full address and contact details typed out in full every time. One customer changes their phone number \u2014 you have to update 400 forms. A relational database solves this by putting the customer's details in one place and referencing them by ID everywhere else.",misconception:"SQL is not a programming language in the traditional sense \u2014 it is a declarative query language. You describe WHAT data you want, not HOW to retrieve it. The database engine decides the how."},{icon:"\u{1F4E1}",title:"SELECT \u2014 which columns?",body:"SELECT is the first clause you write and lists exactly which columns appear in your result. Separate multiple columns with commas: SELECT name, salary. The order you list them is the order they appear in the output. SELECT * returns every column \u2014 useful for exploration but avoid it in production code because adding a column to the table can silently break code expecting a fixed number of columns. SQL evaluates FROM before SELECT \u2014 SELECT shapes the output, not the search.",analogy:"People often assume selecting fewer columns makes a query faster. It usually doesn't \u2014 SQL scans the same rows either way. What SELECT does affect is network transfer and memory: SELECT * on a table with 200 columns sends all 200 values per row across the wire. In practice, naming your columns explicitly is about clarity and safety, not speed. SELECT * breaks silently when someone adds or reorders a column.",misconception:"SELECT does not filter rows \u2014 that is WHERE's job. SELECT only controls which COLUMNS appear. All rows from FROM are read first."},{icon:"\u{1F4CB}",title:"FROM \u2014 which table?",body:"FROM names the table you want to read. Every query that retrieves data must have a FROM clause. You can give a table a short alias: FROM employees e or FROM employees AS e \u2014 then use e.name anywhere in the query. SQL evaluates FROM first internally, even though you write SELECT first. Without FROM, SQL has no data source and throws an error before it even reads your SELECT list.",analogy:"Getting FROM wrong gives you an immediate error \u2014 'no such table'. Getting SELECT wrong sometimes gives an error, sometimes silently returns NULL values if a column doesn't exist. FROM is the foundation: if SQL can't locate the data source, nothing else runs. This is also why aliases matter: you can't use an alias you defined in SELECT when you're writing WHERE, because SELECT hasn't run yet when WHERE is evaluated.",tip:"You can alias a table in FROM: FROM employees e \u2014 then use e.name anywhere in the query instead of the full table name.",misconception:"SELECT and FROM are inseparable. You cannot write SELECT name without FROM \u2014 SQL needs to know which table name belongs to, even if the database has only one table."},{icon:"\u{1F3F7}\uFE0F",title:"AS \u2014 rename columns in output",body:"AS renames a column in the query result \u2014 called an alias. salary AS annual_pay makes the output header read 'annual_pay' instead of 'salary'. The underlying table column is unchanged. Aliases are essential for computed columns (which have no name otherwise) and for clarifying joined queries when two tables share the same column name. You can omit AS \u2014 salary annual_pay works \u2014 but writing it explicitly makes intent clear to anyone reading the query.",analogy:"Every piece of code that reads your query output is coupled to your column names. If you write SELECT salary and downstream code does result['salary'], a column rename breaks everything. AS gives you a stable contract: even if the underlying column is renamed in the schema, your query output keeps showing 'annual_pay'. Aliases make your query's output independent from the schema's naming decisions.",tip:'Aliases with spaces need quotes: salary AS "monthly pay"',misconception:"You cannot use a column alias in the WHERE clause of the same query. WHERE monthly_pay > 5000 fails \u2014 aliases are defined in SELECT, which runs after WHERE. Use the original column name in WHERE."},{icon:"\u{1F522}",title:"Computed columns",body:"You can write arithmetic expressions directly in your SELECT list and SQL computes a result for each row. salary / 12 AS monthly_pay calculates a monthly figure from each stored annual salary. Supported operators: + - * /. Functions like ROUND(salary / 12, 0) apply additional processing. The result exists only in your query output \u2014 it is calculated fresh on every run and never written back to the database table.",analogy:"If you're computing salary/12 in every single query across a busy system, at some point that recalculation cost accumulates. That's when you might store the result in a real column. But stored values go stale: if salary changes, the stored monthly_pay is wrong until someone remembers to update it. Computed columns are always current; stored columns are always fast. That trade-off is the real architectural decision.",tip:"ROUND(salary / 12, 2) controls decimal places. Standard operators: + - * / and % (modulo). You can alias: salary * 12 AS annual.",misconception:"You cannot reference a column alias in another column of the same SELECT. SELECT salary AS s, s * 12 AS annual fails \u2014 aliases don't exist yet when other columns are evaluated. Repeat the expression instead."}],seeit:[{lbl:"Retrieve all employees",ann:"* means every column \u2014 great for exploration",sql:`SELECT *
FROM employees;`},{lbl:"Only name and salary",ann:"Comma-separate the columns you need",sql:`SELECT name, salary
FROM employees;`},{lbl:"Rename output columns",ann:"AS renames only in the output \u2014 database unchanged",sql:`SELECT name        AS employee_name,
       salary      AS annual_salary
FROM employees;`},{lbl:"Compute monthly pay",ann:"Math inline: SQL computes this per row automatically",sql:`SELECT name,
       salary,
       ROUND(salary / 12, 2) AS monthly_pay
FROM employees;`}],guided:[{id:"g1",diff:"Easy",scaffold:.85,title:"Complete the query",context:"The board needs a full employee list \u2014 names and salaries. Choose the correct SQL keyword for each blank.",template:`%%D:SELECT|FROM|WHERE%% name, salary
%%D:FROM|SELECT|WHERE%% employees;`,checks:[{t:"rows",n:12},{t:"col",c:"salary"}],hints:["SELECT always names the columns you want to see","FROM always names the table to read from"],solution:`SELECT name, salary
FROM employees;`,whyItWorks:"SELECT says which columns to show \u2014 FROM says which table to look in. You always need both. SQL won't know what to bring you unless it knows which room to walk into first."},{id:"g2",diff:"Easy",scaffold:.7,title:"Add a readable label",context:"The CFO wants the salary column labelled 'annual_pay' to match her spreadsheet template.",template:`SELECT name,
       salary AS %%B:the alias%%
FROM %%B:table name%%;`,checks:[{t:"rows",n:12},{t:"col",c:"annual_pay"}],hints:["The alias is: annual_pay","The table name is: employees"],solution:`SELECT name, salary AS annual_pay
FROM employees;`,whyItWorks:"AS annual_pay renames only in the output. The actual database column is still called 'salary'. Zero schema change."},{id:"g3",diff:"Medium",scaffold:.5,title:"Compute monthly pay",context:"Payroll needs monthly pay (salary \xF7 12, rounded to 2 decimal places) alongside each employee's name.",template:`SELECT name,
       %%B:function%%(salary %%B:operator%% 12, 2) AS monthly_pay
FROM employees;`,checks:[{t:"rows",n:12},{t:"col",c:"monthly_pay"}],hints:["The rounding function is: ROUND","Division operator: /","Combined: ROUND(salary / 12, 2)"],solution:`SELECT name, ROUND(salary / 12, 2) AS monthly_pay
FROM employees;`,whyItWorks:"ROUND(salary / 12, 2) computes for each row independently. monthly_pay doesn't exist in the DB \u2014 it's derived fresh every time the query runs."}],usecases:[{co:"atlas",icon:"\u{1F4B0}",title:"Board Deck Budget Report",situation:"The CFO's board deck template has fixed column names. The database columns are named differently. Fixing this manually in Excel takes 20 minutes every month.",sql:`SELECT name   AS department,
       city,
       budget AS annual_budget
FROM departments
ORDER BY budget DESC;`,result:"The AS aliases mean the output columns match the slide template exactly. No manual renaming in Excel.",transferPoint:"AS aliases appear in every report query. In the next module you will use WHERE to filter \u2014 but aliases only exist at output time, so WHERE uses the original column name."},{co:"forge",icon:"\u{1F3F7}\uFE0F",title:"Price List for Marketing",situation:"Marketing needs a clean product catalogue \u2014 names and prices only, most expensive first.",sql:`SELECT name, price
FROM products
ORDER BY price DESC;`,result:"Six lines of SQL deliver the catalogue exactly as needed \u2014 no manual column renaming in Excel.",transferPoint:"Column selection is a performance habit. Combined with WHERE in the next lesson, you will write queries that do the minimum work possible on any dataset size."}],recall:[{q:"SELECT salary / 12 AS monthly FROM employees does what?",opts:["Creates a new 'monthly' column in the database","Returns each row's salary divided by 12, labeled 'monthly' in the output","Renames the salary column to 'monthly' permanently","Errors \u2014 division must use a separate query"],ans:1,exp:"AS creates a temporary alias. The result is computed per row on the fly. The database never changes. The column name 'monthly' exists only in this query's output."},{q:"You write SELECT * FROM employees. How many columns are returned?",opts:["1 (just id)","Depends on the WHERE clause","Every column in the employees table","Only the columns listed in GROUP BY"],ans:2,exp:"* is a wildcard that means 'all columns'. Every column in the employees table is returned. In employees that's: id, name, dept_id, salary, hire_date, manager_id."},{q:"Which part of a query does SQL execute first internally?",opts:["SELECT \u2014 to know what to return","FROM \u2014 to locate the data source","WHERE \u2014 to filter rows","AS \u2014 to rename columns"],ans:1,exp:"SQL reads FROM first (locates the table), then applies any WHERE filter, then SELECT picks the columns from the result. This is why you can't use a SELECT alias inside a WHERE clause."}],challenge:[{id:"c1",diff:"Hard",title:"Full Tax Breakdown Report",context:"Vantara Capital's finance team needs a tax report. Show each employee's name, salary, estimated tax (salary \xD7 0.28, rounded to 0 decimal places), and take-home pay (salary \xD7 0.72, rounded to 0 dp). Sort by salary descending so the highest earners appear first.",tables:["employees"],starter:`-- employees: id, name, dept_id, salary, hire_date, manager_ nception:"Common mistake: WHERE runs on the raw rows, before any GROUP BY or aggregate. You cannot filter on AVG(salary) in a WHERE clause \u2014 use HAVING instead."},{icon:"\u2696\uFE0F",title:"Comparison operators",body:"SQL provides: = (equal), <> or != (not equal), > (greater than), < (less than), >= (at least), <= (at most). BETWEEN a AND b is shorthand for >= a AND <= b \u2014 both endpoints are included. IN (val1, val2, val3) checks membership in a list. LIKE matches text patterns: % for any sequence, _ for any single character. All comparisons with NULL return UNKNOWN, not TRUE or FALSE \u2014 use IS NULL and IS NOT NULL for NULL checks. UNKNOWN is treated as FALSE by WHERE, so NULL rows are silently excluded.",analogy:"BETWEEN catches experienced people, not just beginners. salary BETWEEN 60000 AND 90000 includes exactly 60,000 and exactly 90,000. If your pay bands go from 60k to just-under-90k, you need salary >= 60000 AND salary < 90000 instead. The off-by-one errors in BETWEEN are real and silent \u2014 your results are wrong but no error fires.",tip:"BETWEEN is inclusive on both ends for numeric and text values. salary BETWEEN 60000 AND 90000 includes exactly 60000 and 90000. For datetime columns, prefer >= and < to avoid edge cases."},{icon:"\u{1F517}",title:"AND / OR / NOT \u2014 combining conditions",body:"AND requires both sides to be TRUE. OR requires at least one side to be TRUE. NOT flips TRUE to FALSE. Operator precedence: NOT first, then AND, then OR \u2014 the same as mathematics (multiplication before addition). This means city = 'London' OR city = 'Paris' AND salary > 80000 is parsed as (city = 'London') OR (city = 'Paris' AND salary > 80000). Always add parentheses when mixing AND with OR to make grouping explicit and prevent silent logic errors.",analogy:"AND binds tighter than OR \u2014 the same way multiplication binds tighter than addition. WHERE city = 'London' OR city = 'Paris' AND salary > 80000 means: everyone in London (any salary) OR Parisians earning over 80k. Most people expect it to mean: everyone in London or Paris, filtered to salary over 80k. Add parentheses: WHERE (city = 'London' OR city = 'Paris') AND salary > 80000. Missing parentheses in OR conditions is one of the most common sources of wrong-but-no-error query results.",misconception:"AND binds before OR. dept=1 OR dept=2 AND salary>70k means: dept=1 OR (dept=2 AND salary>70k). If you want both departments to require the salary check, write: (dept=1 OR dept=2) AND salary>70k."},{icon:"\u2205",title:"NULL \u2014 the unknown value",body:"NULL represents the absence of a known value \u2014 not zero, not an empty string, just nothing recorded. Any arithmetic with NULL returns NULL: salary + NULL = NULL. Any comparison with NULL returns UNKNOWN: NULL = NULL is not TRUE, it is UNKNOWN, and WHERE treats UNKNOWN as FALSE \u2014 so NULL rows are silently excluded. Test for NULL with IS NULL or IS NOT NULL. Functions like COALESCE(col, fallback) substitute a default whenever NULL would otherwise propagate through your calculation.",analogy:"There's a meaningful difference between a survey respondent writing '0 dependants', someone who wrote 'prefer not to say', and someone who left the question completely blank. A database stores 0 for the first. NULL is the blank \u2014 not zero, not empty string, just nothing there. That's why NULL = NULL is not TRUE: you can't compare two absences and conclude they're the same absence.",misconception:"WHERE manager_id = NULL always returns 0 rows \u2014 SQL won't warn you. It silently finds nothing. This is one of the most common bugs."}],seeit:[{lbl:"Filter by department",ann:"= tests for an exact match",sql:`SELECT name, salary

 obligation to be consistent.",misconception:"NULL values sort last in ASC order and first in DESC order in SQLite. If you need NULLs always at the bottom, add a secondary sort: ORDER BY col IS NULL ASC, col ASC."},{icon:"\u2702\uFE0F",title:"LIMIT \u2014 cap the number of rows",body:"LIMIT n tells SQL to return at most n rows and stop. It applies after all other clauses \u2014 filter, group, and sort happen first, then LIMIT trims the result. OFFSET k skips the first k matching rows: LIMIT 10 OFFSET 20 returns rows 21\u201330, the foundation of page-by-page results. Without ORDER BY, LIMIT returns an unpredictable subset because row order is not guaranteed. Always pair LIMIT with ORDER BY when the specific 'top N' or 'latest N' matters.",analogy:"LIMIT without ORDER BY is how pagination bugs happen. Page 1 returns rows 1\u201310, page 2 should return rows 11\u201320 \u2014 but if the database can return rows in any order, 'row 11' might be something that appeared on page 1 in a different run. Users see duplicates on page 2 and miss rows entirely. Stable pagination requires a stable sort.",tip:"LIMIT caps how many rows are returned. Without ORDER BY, LIMIT returns an unpredictable subset. LIMIT 5 OFFSET 10 skips the first 10 rows and returns the next 5 \u2014 useful for pagination.",misconception:"LIMIT without ORDER BY returns an arbitrary subset \u2014 the database picks whichever rows it finds first. Results look consistent in development but change unpredictably in production. Always pair LIMIT with ORDER BY."},{icon:"\u{1F501}",title:"DISTINCT \u2014 remove duplicate rows",body:"SELECT DISTINCT eliminates rows where every selected column is identical to another row in the result. It operates on the full combination \u2014 not just one column. SELECT DISTINCT city returns unique cities; SELECT DISTINCT city, dept_id returns unique city+department pairs, which typically yields more rows. DISTINCT is evaluated after WHERE but before ORDER BY. It can slow queries on large tables because the database must compare every row \u2014 use it intentionally, not habitually.",analogy:"DISTINCT deduplicates on the full combination of what you selected. Add one more column and you might get more rows back \u2014 not because there are more duplicates, but because the added column makes previously identical rows different. SELECT DISTINCT city gets 5 cities. SELECT DISTINCT city, department gets 12 rows. Neither result is wrong; they answered different questions.",tip:"DISTINCT applies to the combination of all selected columns, not just the first. SELECT DISTINCT dept_id, name will not deduplicate if names differ.",misconception:"DISTINCT forces the database to examine and de-duplicate every row before returning results. On large tables this is expensive. If you only need counts, COUNT(DISTINCT col) is more targeted than a full DISTINCT query."}],seeit:[{lbl:"Sort salaries descending",ann:"DESC = largest first. ASC (default) = smallest first.",sql:`SELECT name, salary

aggregate is all you need, the trade is worth it.",tip:"Use COUNT(*) to count all rows including NULLs. Use COUNT(column) to count only non-NULL values in that column. The difference matters: COUNT(*) vs COUNT(manager_id) gives 12 vs 7 on our table.",misconception:"All aggregates except COUNT(*) skip NULL values silently. COUNT(manager_id) with 5 NULLs returns 7, not 12."},{icon:"\u{1F4E6}",title:"GROUP BY \u2014 one row per group",body:"GROUP BY splits rows into buckets based on shared values, then runs aggregate functions on each bucket independently. The result has exactly one row per unique group value. Every column in SELECT must either appear in GROUP BY or be wrapped in an aggregate \u2014 SQL cannot know which raw value to show for a column that wasn't part of the grouping. GROUP BY runs after WHERE (pre-filters rows) and before HAVING (post-filters groups). Multiple columns in GROUP BY create one bucket per unique combination.",analogy:"Before a chef can count how many of each dish they prepared, they have to physically sort the plates: all the risottos in one section, all the pasta in another. You can't count the risottos while they're mixed with everything else. GROUP BY is that sorting step. It physically (logically) separates the data into groups before COUNT or SUM can run on each pile.",tip:"In SQLite, GROUP BY column order does not affect which groups are formed \u2014 same columns, same groups regardless of order. In databases with ROLLUP/CUBE (MySQL, PostgreSQL), order can matter for those advanced features.",misconception:"Every column in SELECT must either appear in GROUP BY or be inside an aggregate. SELECT name, AVG(salary) FROM employees GROUP BY dept_id is an ERROR \u2014 which 'name'? There are multiple per dept."},{icon:"\u{1F52C}",title:"HAVING \u2014 filter groups (not rows)",body:"HAVING filters the grouped result the same way WHERE filters individual rows \u2014 but HAVING can reference aggregate results, which WHERE cannot. HAVING COUNT(*) > 2 keeps groups with more than 2 rows. HAVING AVG(salary) > 80000 keeps groups where the mean salary exceeds the threshold. A query can have both clauses: WHERE filters raw rows before grouping, GROUP BY groups them, HAVING filters the resulting groups. Omitting GROUP BY when using HAVING treats the entire table as one group.",analogy:"The clearest sign you need HAVING instead of WHERE is the error: 'misuse of aggregate function COUNT()'. SQL won't let you put COUNT or SUM in a WHERE clause \u2014 they don't exist at that point in the query. The second sign is when your WHERE works but gives wrong results: WHERE salary > 80000 filters individual salaries before grouping, so 'departments where everyone earns over 80k' accidentally includes departments with a mix, as long as one person earns over 80k.",tip:"HAVING can reference both aggregate functions and GROUP BY columns. You can even repeat the aggregate in HAVING without defining it in SELECT: GROUP BY dept_id HAVING SUM(salary) > 200000 works even without SUM in SELECT.",misconception:"AVG(salary) in a WHERE clause throws an error \u2014 aggregation hasn't happened yet at WHERE time. Always use HAVING for aggregate conditions."}],seeit:[{lbl:"Company-wide stats",ann:"No GROUP BY = one row summarising all 12 employees",sql:`SELECT COUNT(*)             AS total_employees,

FROM employees

ING sees completed groups after aggregation. Only HAVING can ask 'show me departments with more than 2 people'."}],usecases:[{co:"atlas",icon:"\u{1F4CB}",title:"Board Deck in 4 Lines",situation:"CFO's quarterly board presentation needs headcount and average salary per department \u2014 formatted and sorted.",sql:`SELECT dept_id,

nded to 0dp), total_payroll, and a flag labelled 'above_threshold' (1 if avg > 75000, 0 otherwise). Filter to departments with at least 2 employees. Sort by avg_salary descending.",tables:["employees"],starter:`-- employees: id, name, dept_id, salary, hire_date, manager_id

 salesperson's name once and you'd need to update thousands of records, hoping you didn't miss one. Normalisation split that into separate tables. JOIN is the cost you pay to reassemble what normalisation separated, but you only pay it when you need it.",misconception:null},{icon:"\u{1F535}",title:"INNER JOIN \u2014 matched rows only",body:"INNER JOIN (written as just JOIN) returns rows only where the ON condition finds a match in both tables. Employees whose dept_id has no match in departments are excluded \u2014 silently, without error. Departments with no employees are also excluded. The result is only the matched intersection. This silent exclusion catches developers off guard when row counts drop unexpectedly after adding a join \u2014 always check your counts before and after.",analogy:"A finance team ran an INNER JOIN between invoices and their matched payments to report total collected revenue. The number looked fine. Six months later an auditor found that 3% of invoices had no matching payment record \u2014 a system bug had created invoices without payment entries. The INNER JOIN had silently excluded all of them from the revenue report. The total was wrong and nobody noticed because the query ran without errors.",tip:"Default to LEFT JOIN when you cannot be certain all rows have matches in the other table. INNER JOIN silently drops unmatched rows \u2014 intentional when you want only matched rows, risky when you assume clean data."},{icon:"\u{1F7E1}",title:"LEFT JOIN \u2014 keep all left rows",body:"LEFT JOIN returns every row from the left table (the one in FROM), whether or not a match exists in the right table. Where no right-side match is found, all right-table columns for that row appear as NULL. This makes LEFT JOIN ideal for finding absent relationships: SELECT c.name FROM customers c LEFT JOIN orders o ON c.id = o.customer_id WHERE o.id IS NULL returns customers who have never ordered. INNER JOIN would erase those customers entirely.",analogy:"LEFT JOIN is most useful when you're debugging or auditing. You're not looking for what matched \u2014 you're looking for what didn't. Which customers have never placed an order? LEFT JOIN customers to orders, then filter WHERE orders.id IS NULL. The customers with no orders appear with NULLs in the order columns. INNER JOIN would erase those customers entirely, and you'd never know they existed.",tip:"Most analysts default to LEFT JOIN to avoid accidentally losing rows they don't know about."},{icon:"\u26A1",title:"Always alias table names and prefix columns",body:"When a query references more than one table, give each table a short alias in FROM and prefix every column reference with it. FROM employees e JOIN departments d makes you write e.name and d.name clearly. Without prefixes, SQL throws 'ambiguous column name' when both tables share a column name. Even where no ambiguity exists, prefixes make the source of every value immediately readable \u2014 essential when debugging a 4-table join six months after writing it.",analogy:"Skipping table prefixes causes 'ambiguous column name' errors \u2014 SQL genuinely can't tell which table's 'id' you mean when both tables have one. But there's a subtler problem: even when SQL can resolve it, the next engineer reading your query can't. e.salary vs d.salary makes the source obvious at a glance. Six months after writing a 4-table join query, even the author needs the prefixes to understand it.",misconception:"SELECT name FROM employees e JOIN departments d is an ERROR \u2014 'name' exists in both tables and is ambiguous. Always write e.name or d.name."}],seeit:[{lbl:"INNER JOIN \u2014 employee + dept name",ann:"ON defines the bridge: employee dept_id matches department id",sql:`SELECT e.name,

FROM employees e

GROUP BY d.id, d.name, d.budget
ORDER BY headcount DESC;`},{lbl:"3-table JOIN \u2014 full order details",ann:"orders is the hub \u2014 customer_id links to customers, product_id links to products",sql:`SELECT c.name AS customer,

LEFT JOIN employees m ON e.manager_id = m.id

ORDER BY remaining ASC;`,result:"Engineering is most over-budget (payroll nearly equals budget). An empty department appears with $0 payroll.",transferPoint:"LEFT JOIN + COALESCE is the standard pattern for 'include all X even if no matching Y exists'."}],recall:[{q:"A LEFT JOIN B. Table A has 5 rows, 2 have no match in B. Result rows?",opts:["3 (matched rows only)","5 (all of A, NULLs for unmatched)","7 (all rows from both)","Depends on the ON condition"],ans:1,exp:"LEFT JOIN always returns ALL rows from the left table \u2014 exactly 5. The 2 unmatched rows appear with NULLs in all B columns. INNER JOIN would return only 3."},{q:"You want ALL departments, even those with zero employees. departments is on the left. Which JOIN?",opts:["INNER JOIN employees to departments","LEFT JOIN employees to departments","LEFT JOIN departments to employees","CROSS JOIN"],ans:2,exp:"departments on the left with LEFT JOIN means: keep all departments. Each department is matched to its employees. Departments with no employees appear with NULL employee columns and COUNT(e.id) = 0."},{q:"SELECT name FROM employees e JOIN departments d is ambiguous. Why?",opts:["You can't use aliases in a JOIN","'name' exists in both employees and departments \u2014 SQL can't decide which","JOIN requires you to SELECT *","The alias 'e' conflicts with 'employees'"],ans:1,exp:"Both tables have a 'name' column. Without a prefix (e.name or d.name), SQL doesn't know which one you mean and throws an error. Always prefix column names in JOIN queries."}],challenge:[{id:"c1",diff:"Hard",title:"Full Org Chart with Budget Utilisation",context:"Crestline's CHRO needs a complete org chart: each employee's name, their manager's name (or 'No Manager'), their department name, and what percentage of their department's total payroll their salary represents (1 decimal place, labelled pct_of_dept). Sort by department, then percentage descending.",tables:["employees","departments"],starter:`-- Use: employees e, employees m on was never reached because every high earner satisfied >= 50000 first and SQL stopped there. Wrong order, no error, wrong labels in every report for two months before someone noticed the Senior headcount was zero.",misconception:"SQL stops at the first TRUE condition. If salary >= 70000 appears before salary >= 90000, a $95k employee gets labelled 'Mid', not 'Senior'. Put the most restrictive condition first."},{icon:"\u2B1C",title:"COALESCE \u2014 first non-NULL value",body:"COALESCE(expr1, expr2, ...) evaluates arguments left to right and returns the first non-NULL value. It accepts any number of arguments. COALESCE(manager_id, 0) replaces NULL with 0. COALESCE(notes, description, 'No info') tries three columns in sequence. It short-circuits \u2014 once it finds a non-NULL value, remaining arguments are not evaluated. COALESCE is the idiomatic SQL replacement for CASE WHEN col IS NULL THEN fallback ELSE col END.",analogy:"Your employee table has mobile, home, and work phone columns \u2014 most people have a mobile but some only have a work number, a few have none at all. COALESCE(mobile, home, work, 'No contact') gives you the best available number per person in one column, without writing a CASE block. It's the database equivalent of 'try the first option; if that's blank, try the next; if everything's blank, use this default'."},{icon:"\xF7",title:"NULLIF \u2014 make a value NULL on demand",body:"NULLIF(a, b) returns NULL when a equals b, and returns a in all other cases. It is most useful as a division-safety guard: salary / NULLIF(hours, 0) returns NULL rather than a runtime error when hours is zero. NULL divided by anything equals NULL, which propagates cleanly. NULLIF is the exact inverse of COALESCE: COALESCE converts NULL into a value; NULLIF converts a specific value into NULL. Together they give precise control over missing and zero-equivalent values.",analogy:"When there are zero orders and you calculate average order value, you have two bad options: crash with a division-by-zero error, or return zero (which is misleading \u2014 zero could be a real average). NULLIF gives you a third option: return NULL, which means 'this calculation has no valid answer'. Downstream, NULL propagates cleanly \u2014 it won't distort a SUM, it shows up blank in a report, and it can be handled with COALESCE.",tip:"NULLIF is the inverse of COALESCE. COALESCE provides a fallback when a value is NULL; NULLIF intentionally produces NULL when two values match."}],seeit:[{lbl:"Salary tier labels",ann:"CASE evaluates top-to-bottom \u2014 most restrictive condition first",sql:`SELECT name, salary,
  CASE
    WHEN salary >= 90000 THEN 'Senior'
    WHEN salary >= 70000 THEN 'Mid'
    ELSE                      'Junior'
  END AS tier
FROM employees
ORDER BY salary DESC;`},{lbl:"COALESCE \u2014 replace NULLs",ann:"COALESCE returns the first non-NULL value in its argument list",sql:`SELECT name,
  COALESCE(CAST(manager_id AS TEXT), 'Unassigned') AS reports_to
FROM employees;`},{lbl:"Conditional aggregation",ann:"SUM(CASE WHEN ...) counts or totals only rows that match a condition",sql:`SELECT
  COUNT(*) AS total,
  SUM(CASE WHEN salary >= 90000 THEN 1 ELSE 0 END) AS senior_count,
  SUM(CASE WHEN salary < 70000  THEN 1 ELSE 0 END) AS junior_count
FROM employees;`},{lbl:"NULLIF \u2014 safe division",ann:"NULLIF prevents division-by-zero; NULL propagates safely",sql:`-- budget_per_head = NULL when headcount is 0 (no crash)
SELECT d.name,

FROM departments d
LEFT JOIN employees e ON e.dept_id = d.id
GROUP BY d.id, d.name, d.budget;`}],guided:[{id:"g1",diff:"Easy",scaffold:.8,title:"Label employees by salary tier",context:"Camila wants a 'tier' column: Senior (\u2265 $90k), Mid (\u2265 $70k), Junior (below $70k). Show name, salary, and tier.",template:`SELECT name, salary,

  CASE
    WHEN salary >= 90000 THEN 'Senior'
    WHEN salary >= 70000 THEN 'Mid'
    ELSE 'Junior'
  END AS tier
FROM employees ORDER BY salary DESC;`,whyItWorks:"CASE evaluates top to bottom and stops the moment one condition is true. If 'Mid' (>= 70000) came before 'Senior' (>= 90000), a \xA395k employee would be labelled Mid \u2014 because 95000 >= 70000 is true, and CASE stops there."},{id:"g2",diff:"Easy",scaffold:.7,title:"Replace NULL manager with 'Unassigned'",context:"The CFO wants no blank cells in the manager column. Replace NULL with the text 'Unassigned'.",template:`SELECT name,

  COALESCE(CAST(manager_id AS TEXT), 'Unassigned') AS reports_to
FROM employees;`,whyItWorks:"CAST converts the integer manager_id to TEXT. COALESCE then returns 'Unassigned' only when manager_id is NULL \u2014 which CAST(NULL AS TEXT) also is."},{id:"g3",diff:"Medium",scaffold:.5,title:"Count employees per salary tier",context:"Camila wants a summary: how many employees are in each tier? Use conditional aggregation (SUM + CASE).",template:`SELECT

  SUM(CASE WHEN salary < 70000  THEN 1 ELSE 0 END) AS junior_count
FROM employees;`,whyItWorks:"SUM(CASE WHEN ... THEN 1 ELSE 0 END) counts rows matching a condition. It's a pivot technique \u2014 turning row data into columns."},{id:"g4",diff:"Hard",title:"Sort employees by seniority tier, then salary",context:"Finance wants a report ordered by seniority (Senior first, Mid second, Junior last) and within each tier by salary descending. Use CASE WHEN inside ORDER BY to create a custom numeric sort key.",template:`SELECT name, salary,

    WHEN salary >= 70000 THEN 2

  COUNT(*) AS total,
  SUM(CASE WHEN salary >= 90000 THEN 1 ELSE 0 END) AS senior,
  SUM(CASE WHEN salary >= 70000 AND salary < 90000 THEN 1 ELSE 0 END) AS mid,
  SUM(CASE WHEN salary < 70000 THEN 1 ELSE 0 END) AS junior
FROM employees
GROUP BY dept_id
ORDER BY dept_id;`,result:"One row per department showing the tier breakdown. Engineering has 4 employees \u2014 3 Senior, 1 Mid.",transferPoint:"Conditional aggregation (SUM + CASE WHEN) is the SQL equivalent of COUNTIF in Excel. It's used in virtually every BI dashboard."},{co:"forge",icon:"\u{1F527}",title:"Safe Budget-per-Head Calculation",situation:"Ops wants budget per head per department, but two departments have zero employees \u2014 a direct division would crash.",sql:`SELECT d.name,
  d.budget,
  COUNT(e.id) AS headcount,
  CASE
    WHEN COUNT(e.id) = 0 THEN 'No staff'
    ELSE CAST(ROUND(d.budget / COUNT(e.id), 0) AS TEXT)
  END AS budget_per_head
FROM departments d
LEFT JOIN employees e ON e.dept_id = d.id
GROUP BY d.id, d.name, d.budget
ORDER BY d.budget DESC;`,result:"Departments with staff show the per-head budget. Those with zero staff show 'No staff' instead of crashing.",transferPoint:"Always guard against division-by-zero in SQL. CASE WHEN ... = 0 THEN fallback is the clearest approach; NULLIF is the compact one."}],recall:[{q:"Your CASE has: >= 90000 THEN 'Senior', then >= 70000 THEN 'Mid'. An employee earns $95,000. What tier?",opts:["'Mid' \u2014 95000 >= 70000 is also true","'Senior' \u2014 95000 >= 90000 matches first and CASE stops","An error \u2014 two conditions match","Both 'Senior' and 'Mid'"],ans:1,exp:"CASE evaluates top-to-bottom and stops at the first match. $95,000 >= 90,000 is true, so CASE returns 'Senior' immediately and never checks >= 70,000. Always put the most restrictive threshold first."},{q:"COALESCE(NULL, NULL, 'fallback', 'other') returns?",opts:["NULL","'fallback'","'other'","An error"],ans:1,exp:"COALESCE returns the first non-NULL value. The first two arguments are NULL so they're skipped. 'fallback' is the third argument and is not NULL, so it's returned. 'other' is never evaluated."},{q:"NULLIF(salary, 0) when salary = 50000 returns?",opts:["NULL","0","50000","An error"],ans:2,exp:"NULLIF(a, b) returns NULL only when a equals b. 50000 \u2260 0, so NULLIF returns 50000 unchanged. It only produces NULL when the two arguments are equal."},{q:"NULLIF(headcount, 0) in the expression budget / NULLIF(headcount, 0) is used to:",opts:["Check if headcount is NULL","Prevent division-by-zero \u2014 returns NULL when headcount is 0","Display 0 when headcount is zero","Convert headcount to a string"],ans:1,exp:"NULLIF(x, 0) returns NULL when x equals 0, preventing a divide-by-zero error. NULL / anything = NULL in SQL \u2014 no crash. COALESCE can then show a default value instead of NULL."}],challenge:[{id:"c1",diff:"Hard",title:"Full Compensation Report",context:"Camila's quarterly board report: show each department's name, headcount, average salary (0dp), salary tier breakdown (senior/mid/junior counts), and a 'health' label: '\u{1F7E2} Balanced' if no tier exceeds 60% of headcount, '\u{1F7E1} Skewed' otherwise. Sort by avg_salary descending.",tables:["employees","departments"],starter:`-- Hint: join employees to departments, GROUP BY dept, use CASE + SUM
SELECT d.name AS department,
       COUNT(e.id) AS headcount,
       ROUND(AVG(e.salary), 0) AS avg_salary,
       SUM(CASE WHEN e.salary >= 90000 THEN 1 ELSE 0 END) AS senior,
       SUM(CASE WHEN e.salary >= 70000 AND e.salary < 90000 THEN 1 ELSE 0 END) AS mid,
       SUM(CASE WHEN e.salary < 70000 THEN 1 ELSE 0 END) AS junior,
       `,checks:[{t:"rows",n:5},{t:"col",c:"health"}],hints:["CASE WHEN MAX(SUM(senior),SUM(mid),SUM(junior)) > 0.6 * COUNT(e.id) \u2014 but SQLite doesn't have MAX for expressions: use nested CASE","Simpler: CASE WHEN senior > COUNT(e.id)*0.6 OR mid > COUNT(e.id)*0.6 OR junior > COUNT(e.id)*0.6 THEN '\u{1F7E1} Skewed' ELSE '\u{1F7E2} Balanced' END AS health","FROM departments d LEFT JOIN employees e ON e.dept_id = d.id GROUP BY d.id, d.name ORDER BY avg_salary DESC"],solution:`SELECT d.name AS department, COUNT(e.id) AS headcount,
  ROUND(AVG(e.salary), 0) AS avg_salary,
  SUM(CASE WHEN e.salary >= 90000 THEN 1 ELSE 0 END) AS senior,
  SUM(CASE WHEN e.salary >= 70000 AND e.salary < 90000 THEN 1 ELSE 0 END) AS mid,
  SUM(CASE WHEN e.salary < 70000 THEN 1 ELSE 0 END) AS junior,
  CASE
    WHEN SUM(CASE WHEN e.salary >= 90000 THEN 1 ELSE 0 END) > COUNT(e.id)*0.6
      OR SUM(CASE WHEN e.salary >= 70000 AND e.salary < 90000 THEN 1 ELSE 0 END) > COUNT(e.id)*0.6
      OR SUM(CASE WHEN e.salary < 70000 THEN 1 ELSE 0 END) > COUNT(e.id)*0.6
    THEN '\u{1F7E1} Skewed'
    ELSE '\u{1F7E2} Balanced'
  END AS health
FROM departments d

GROUP BY d.id, d.name
ORDER BY avg_salary DESC;`,celebration:"JOIN, GROUP BY, conditional aggregation, CASE inside SELECT, and a custom sort key \u2014 this is a board-deck query. A senior analyst wrote something almost identical for a FTSE 500 comp review last quarter."}],sheet:{syntax:[{label:"CASE WHEN",code:`CASE

  AS hourly_rate
FROM employees;`}],rules:[{icon:"\u26A1",text:"CASE checks conditions top to bottom \u2014 the first matching WHEN wins. Later conditions are never evaluated for that row."},{icon:"\u{1F6AB}",text:"Without ELSE, a CASE that matches no WHEN returns NULL \u2014 always add ELSE unless NULL is intentional."},{icon:"\u{1F517}",text:"COALESCE(a, b, c) returns the first non-NULL value in the list. Use it to replace NULLs with a default."}],gotcha:"NULLIF(col, 0) is a division guard \u2014 it returns NULL when col equals 0, which makes division return NULL instead of crashing with 'division by zero'."}},{id:"i3",mins:15,title:"String Functions",tagline:"Clean, search, and reshape text \u2014 a daily analyst superpower.",hook:{co:"nexus",day:"Tuesday, 10:07 am",msg:"Can you pull a clean contact list from customers? Lowercase emails, uppercase company names, and flag any .io domains. Also I need first names only from the employee list for the badge printer.",from:"Zola Oduya \xB7 Head of Growth",insight:"Raw text is messy. String functions let you reshape, search, and standardise it without touching the underlying data \u2014 essential for any analytics or reporting role."},concepts:[{icon:"\u{1F520}",title:"UPPER(), LOWER(), LENGTH()",body:"UPPER(col) converts every character to uppercase. LOWER(col) converts every character to lowercase. LENGTH(col) returns the character count. None of these modify the stored data \u2014 only the query output changes. These functions matter most in joins and comparisons: LOWER(a.email) = LOWER(b.email) forces a case-insensitive match. In SQLite, string comparisons are case-sensitive by default, so normalising case with LOWER before comparing is necessary whenever data arrives from multiple sources with inconsistent capitalisation.",analogy:"A company merged two CRM systems. System A stored email addresses as typed ('Alice@Company.com'). System B normalised everything to lowercase ('alice@company.com'). The JOIN to unify customer records matched on email and silently excluded half the customers \u2014 because 'Alice@Company.com' <> 'alice@company.com' in SQL. Wrapping both sides in LOWER() fixed it instantly. Case inconsistency in joins is one of the most common causes of mysteriously low match rates.",tip:"LOWER(email) is essential for case-insensitive comparisons. Two emails that look different may be the same person.",misconception:"These functions do not change the stored data. They only affect the result set of your query."},{icon:"\u{1F50D}",title:"LIKE \u2014 pattern matching",body:"LIKE tests a string against a pattern. % matches any sequence of zero or more characters. _ matches exactly one character. 'S%' matches anything starting with S. '%tech%' matches 'tech' anywhere in the string. 'J__e' matches four-character strings starting with J and ending with e. LIKE is case-insensitive in SQLite. NOT LIKE excludes matches. Without wildcards, LIKE behaves identically to = \u2014 use = for exact matches and LIKE only when you need partial matching.",analogy:"LIKE 'smith%' is fast \u2014 the database knows names start with 'smith' and can jump to the right section of an index. LIKE '%smith' is slow \u2014 it can't use an index because it doesn't know where the string starts, so it reads every single row in the table. This difference is invisible on a dev database with 1,000 rows and catastrophic in production with 50 million. Always ask: is my % at the beginning or the end?",tip:"LIKE '%@gmail.com' finds all Gmail addresses. LIKE '2024-%' finds all 2024 dates."},{icon:"\u2702\uFE0F",title:"SUBSTR() and INSTR()",body:"SUBSTR(col, start, length) extracts a portion of a string. Start position is 1-based (first character = 1). Omitting length returns everything from start to the end. SUBSTR('2024-03-15', 1, 4) returns '2024'. INSTR(col, search) returns the position of the first occurrence of search, or 0 if not found. Combine them: SUBSTR(col, 1, INSTR(col, '-') - 1) extracts everything before the first hyphen \u2014 useful for parsing structured codes where position or delimiter encodes meaning.",tip:"SUBSTR(hire_date, 1, 4) extracts the year from a date string like '2019-03-15'. INSTR(name, ' ') finds the space between first and last name."},{icon:"\u{1F527}",title:"REPLACE() and TRIM()",body:"REPLACE(col, old, new) substitutes every occurrence of old with new throughout the string \u2014 case-sensitive, all occurrences, not just the first. TRIM(col) removes leading and trailing whitespace. LTRIM removes only leading whitespace; RTRIM removes only trailing whitespace. These are essential for cleaning imported data \u2014 trailing spaces silently break join conditions because 'Acme Corp ' does not equal 'Acme Corp'. Apply TRIM before joining on text columns from any external data source.",analogy:"A team imported 80,000 customer records from a legacy system. Joins on customer name were returning zero matches \u2014 turns out the legacy system padded every name field to 50 characters with trailing spaces. 'Acme Corp' was stored as 'Acme Corp                               '. TRIM(name) fixed it in one pass. Without it, every single lookup and join would have failed silently, returning empty results with no errors.",tip:"REPLACE(email, '@', ' [at] ') creates display-safe email addresses. TRIM() is essential after importing CSV data.",misconception:"REPLACE() is case-sensitive in SQLite. REPLACE(name, 'osei', 'X') will NOT match 'Osei'."}],seeit:[{lbl:"Normalise names and emails for a contact export",ann:"Returns a new value \u2014 original column is never modified",sql:`SELECT
  UPPER(name) AS display_name,
  LOWER(email) AS clean_email
FROM customers
ORDER BY name;`},{lbl:"_ wildcard \u2014 match exactly one character",ann:"_ matches exactly ONE character. Use for fixed-format patterns.",sql:`-- Names where 2nd char is o:
SELECT name FROM employees WHERE name LIKE '_o%' ORDER BY name;`},{lbl:"Find customers with .io email domains",ann:"% matches any characters \u2014 LIKE is SQL's pattern search tool",sql:`SELECT name, email
FROM customers
WHERE email LIKE '%.io'
ORDER BY name;`},{lbl:"Extract first name from full name",ann:"INSTR finds the space position; SUBSTR cuts from position 1 up to just before it",sql:`SELECT
  name,
  SUBSTR(name, 1, INSTR(name, ' ') - 1) AS first_name,
  LENGTH(name) AS full_len
FROM employees
ORDER BY first_name;`},{lbl:"Anonymise emails for a data sample",ann:"Substitutes every occurrence \u2014 useful for masking or reformatting",sql:`SELECT
  name,
  REPLACE(email, '@', ' [at] ') AS safe_email
FROM customers;`}],guided:[{id:"g1",diff:"Easy",title:"Format names for a badge printer",context:"The badge printer needs all names in UPPERCASE. Show each name alongside its uppercase version.",template:`SELECT name,
  %%D:UPPER|LOWER|LENGTH%%(name) AS badge_name

ORDER BY name;`,checks:[{t:"rows",n:12},{t:"col",c:"badge_name"}],hints:["UPPER() converts text to uppercase","The column alias is badge_name"],solution:"SELECT name, UPPER(name) AS badge_name FROM employees ORDER BY name;",whyItWorks:"UPPER() transforms only what's shown \u2014 the name stored in the database stays exactly as it was typed. The badge printer gets capitals; the database is untouched."},{id:"g2",diff:"Easy",title:"Find employees whose names contain the letter F",context:"HR is doing an informal audit and needs all employees with F in their name (case-insensitive).",template:`SELECT name

ORDER BY name;`,checks:[{t:"rows",n:4}],hints:["LIKE with % on both sides matches anywhere in the string","Pattern: '%f%' \u2014 SQLite LIKE is case-insensitive so this matches F too"],solution:"SELECT name FROM employees WHERE name LIKE '%f%' ORDER BY name;",whyItWorks:"LIKE '%f%' matches any name containing f or F \u2014 SQLite LIKE is case-insensitive by default. The two % wildcards allow anything before and after the letter."},{id:"g3",diff:"Medium",title:"Clean messy email data",context:"The customer import produced inconsistent emails \u2014 some have leading/trailing spaces, some are in ALL CAPS. Standardise all emails: trim whitespace and convert to lowercase.",template:`SELECT name, %%D:TRIM|UPPER|SUBSTR%%(%%D:LOWER|UPPER|REPLACE%%(email)) AS clean_email

ORDER BY name;`,checks:[{t:"rows",n:5},{t:"col",c:"clean_email"}],hints:["Nest two functions: TRIM wraps LOWER","Order matters: LOWER first, then TRIM","Result: all lowercase, no leading/trailing spaces"],solution:"SELECT name, TRIM(LOWER(email)) AS clean_email FROM customers ORDER BY name;",whyItWorks:"LOWER(email) converts to lowercase first. TRIM() then strips whitespace. Nesting is read inside-out: the inner function runs first. This LOWER+TRIM pattern appears in virtually every ETL pipeline that normalises imported data."},{id:"g4",diff:"Hard",title:"Build a clean customer directory",context:"Marketing needs a formatted customer directory: display name in uppercase, clean email in lowercase, flag whether the domain ends in .io, and sort by display name.",template:`SELECT
  UPPER(name) AS display_name,
  %%D:LOWER|UPPER|LENGTH%%(email) AS clean_email,
  CASE WHEN email LIKE %%B:io pattern%%
    THEN 'Tech' ELSE 'Other' END AS domain_type
FROM customers
ORDER BY display_name;`,checks:[{t:"rows",n:5},{t:"col",c:"domain_type"}],hints:["LOWER(email) for clean_email","io pattern: '%.io'","CASE WHEN classifies each row"],solution:"SELECT UPPER(name) AS display_name, LOWER(email) AS clean_email, CASE WHEN email LIKE '%.io' THEN 'Tech' ELSE 'Other' END AS domain_type FROM customers ORDER BY display_name;",whyItWorks:"Combining UPPER, LOWER, LIKE, and CASE WHEN in one query is very common in reporting. Each function processes independently \u2014 no performance cost beyond a single table scan."}],usecases:[{co:"nexus",icon:"\u{1F4CB}",title:"Contact List Export",situation:"Marketing needs a clean contact list: uppercase names, lowercase emails, flagged .io tech domains. The raw data has inconsistent casing from different import sources.",sql:`SELECT
  UPPER(name) AS company,
  LOWER(email) AS email,
  CASE WHEN email LIKE '%.io' OR email LIKE '%.dev'
    THEN 'Tech' ELSE 'Other' END AS segment
FROM customers
ORDER BY segment, company;`,result:"All 5 customers formatted with consistent casing and segmented by domain type. Ready for the email campaign tool.",transferPoint:"String functions normalise messy real-world data without altering the database. Always normalise in the query, not by updating stored values."},{co:"atlas",icon:"\u{1F464}",title:"First-Name Badge Report",situation:"Vantara Capital is running an all-hands meeting and needs first-name-only badges for all employees, sorted alphabetically.",sql:`SELECT
  SUBSTR(name, 1, INSTR(name, ' ') - 1) AS first_name,
  dept_id,
  salary
FROM employees
ORDER BY first_name;`,result:"12 rows, each with just the first name extracted from the full name field. No manual editing required.",transferPoint:"SUBSTR + INSTR is the SQLite pattern for splitting name fields. In production databases you would store first and last names separately \u2014 but legacy systems often do not."}],recall:[{q:"What does the % wildcard mean in a LIKE pattern?",opts:["Exactly one character","Any single digit","Any sequence of zero or more characters","End of string"],ans:2,exp:"% matches any sequence of characters including an empty sequence. 'A%' matches 'A', 'Alice', 'Vantara Capital'. The _ wildcard matches exactly one character."},{q:"You need to find all employees hired in 2020. Dates are stored as '2020-07-01'. Which expression extracts just the year?",opts:["YEAR(hire_date)","EXTRACT(YEAR FROM hire_date)","SUBSTR(hire_date, 1, 4)","LEFT(hire_date, 4)"],ans:2,exp:"SQLite does not have a YEAR() or EXTRACT() function. SUBSTR(hire_date, 1, 4) extracts the first 4 characters of the YYYY-MM-DD string, which is always the year. LEFT() also does not exist in SQLite."},{q:"REPLACE('hello@work.com', '@', ' [at] ') returns what?",opts:["'hello [at] work.com'","'hello@work.com' \u2014 REPLACE never changes anything","'hello [AT] work.com' \u2014 REPLACE is case-insensitive","An error \u2014 @ is a special character"],ans:0,exp:"REPLACE(str, old, new) substitutes every occurrence of old with new. It returns 'hello [at] work.com'. REPLACE is case-sensitive for the search string, but @ is not a letter so case does not apply here."}],challenge:[{id:"c1",diff:"Hard",title:"Employee Directory with Formatted Fields",context:"HR needs a complete employee directory. For each employee show: their first name only (extracted from name), full name in UPPERCASE as display_name, hire year (from hire_date), a tenure label ('Veteran' if hired before 2019, 'Established' if 2019-2021, 'Recent' if 2022+). Sort by hire year then first name.",tables:["employees"],starter:`SELECT
  SUBSTR(name, 1, INSTR(name, ' ') - 1) AS first_name,
  UPPER(name) AS display_name,
  SUBSTR(hire_date, 1, 4) AS hire_year,
  `,checks:[{t:"rows",n:12},{t:"col",c:"tenure_label"}],hints:["CASE WHEN SUBSTR(hire_date,1,4) < '2019' THEN 'Veteran'","WHEN SUBSTR(hire_date,1,4) <= '2021' THEN 'Established'","ELSE 'Recent' END AS tenure_label","ORDER BY hire_year, first_name"],solution:`SELECT
  SUBSTR(name, 1, INSTR(name, ' ') - 1) AS first_name,
  UPPER(name) AS display_name,
  SUBSTR(hire_date, 1, 4) AS hire_year,
  CASE
    WHEN SUBSTR(hire_date,1,4) < '2019' THEN 'Veteran'
    WHEN SUBSTR(hire_date,1,4) <= '2021' THEN 'Established'
    ELSE 'Recent'
  END AS tenure_label
FROM employees
ORDER BY hire_year, first_name;`,celebration:"SUBSTR, INSTR, UPPER, and CASE WHEN combined \u2014 this is a real HR report that would have taken hours in Excel. You built it in one query."}],sheet:{syntax:[{label:"Case & length",code:`UPPER(name), LOWER(name)
LENGTH(name)
TRIM(name)   -- removes whitespace`},{label:"Pattern matching",code:`WHERE LOWER(name) LIKE 'a%'   -- starts with a
WHERE name LIKE '%son'         -- ends with son
WHERE name LIKE '_ohn'         -- _ = one char`},{label:"Substring & replace",code:`SUBSTR(name, 1, 3)           -- first 3 chars
REPLACE(name, 'Ltd', 'Limited')`}],rules:[{icon:"\u26A0\uFE0F",text:"SQLite string comparisons are case-sensitive \u2014 always wrap with LOWER() before comparing or use LIKE with LOWER()."},{icon:"\u{1F4CC}",text:"% matches any sequence of characters. _ matches exactly one character. Escape with ESCAPE if you need literal % or _."},{icon:"\u2702\uFE0F",text:"Always TRIM() before joining on text columns \u2014 trailing spaces silently break JOIN conditions."}],gotcha:"'Acme Corp' \u2260 'Acme Corp ' \u2014 a trailing space makes these different strings. A JOIN on untrimmed text columns will silently drop rows."}},{id:"i4",mins:18,title:"Dates & Time",tagline:"Filter, group, and calculate across time \u2014 the backbone of analytics.",hook:{co:"forge",day:"Thursday, 8:54 am",msg:"Need a quick one: how many employees did we hire each year? And who joined in the last few years \u2014 I need to plan onboarding cohorts. Also what is our average order volume by month?",from:"Rohan Reinholt \xB7 Operations Director",insight:"Dates look simple but hide complexity. Extracting parts, calculating durations, and grouping by period are the backbone of every time-based report in business."},concepts:[{icon:"\u{1F4C5}",title:"Date storage and strftime()",body:"SQLite stores dates as TEXT in YYYY-MM-DD format (ISO 8601). This format sorts correctly as plain text because the year comes first. strftime(format, col) extracts or reformats a date: '%Y' gives the four-digit year, '%m' gives the two-digit month, '%d' gives the two-digit day, '%Y-%m' gives year-month. strftime also computes relative dates: strftime('%Y-%m-%d', 'now', '-30 days') returns the date 30 days ago. The result is always a TEXT string, never a numeric type.",analogy:"The ISO date format (YYYY-MM-DD) was specifically designed so that sorting dates alphabetically gives the same result as sorting them chronologically. '2024-01-15' comes before '2024-03-01' alphabetically and chronologically \u2014 because year comes first. If dates were stored as '15/01/2024' (day-first, European style), alphabetical sort would put '15' before '3' and the ordering would be completely wrong.",tip:"strftime('%Y', hire_date) is the most common date operation in SQLite. Always use ISO format strings for comparisons \u2014 '2024-01' sorts correctly as text.",misconception:"SQLite has no native DATE type. Dates are stored as text. This means you can use text comparisons like hire_date >= '2020-01-01' \u2014 they work because ISO format sorts lexicographically."},{icon:"\u23F1\uFE0F",title:"Date comparisons and filtering",body:"Because ISO dates sort correctly as text, standard comparison operators work directly on date columns: =, <>, >, <, >=, <=, BETWEEN, and IN. hire_date >= '2020-01-01' returns everyone hired from 2020 onwards. BETWEEN '2019-01-01' AND '2021-12-31' is inclusive on both endpoints. Dates in conditions must be quoted strings in YYYY-MM-DD format matching the stored format. LIKE '2024-03%' matches all March 2024 dates, though strftime is generally cleaner for month-level filtering.",tip:"For current date comparisons in SQLite, use date('now'). hire_date >= date('now', '-1 year') finds employees hired in the last 12 months."},{icon:"\u{1F522}",title:"julianday() for duration arithmetic",body:"julianday(date) converts any date string to a continuous decimal day count. Subtracting two julianday values gives the exact number of days between them as a plain number you can use in arithmetic: ROUND(julianday('now') - julianday(hire_date)) gives days of tenure. Divide by 365.25 for approximate years. julianday also accepts 'now' and modifier strings: julianday('now', 'start of month') gives the Julian Day of the first day of the current month.",analogy:"A hiring manager wants to know how many days each vacancy was open \u2014 from posting date to hire date. You can't subtract dates like numbers, and calculating months and years manually involves handling leap years, 30-day months, and edge cases. julianday converts both dates to plain decimal numbers and the subtraction gives you exact days. It's the same logic a project tracker uses when it shows 'elapsed: 23 days'.",tip:"ROUND((julianday('2025-01-01') - julianday(hire_date)) / 365.0, 1) gives tenure in years to one decimal place."},{icon:"\u{1F4CA}",title:"Grouping by time period",body:"Placing strftime() inside GROUP BY creates one output row per time period. GROUP BY strftime('%Y', hire_date) groups by year. GROUP BY strftime('%Y-%m', order_date) groups by calendar month. Combine with COUNT, SUM, or AVG for per-period aggregates. Sort with ORDER BY strftime('%Y-%m', order_date) to present results chronologically. Note: GROUP BY only produces rows for periods that actually exist in the data \u2014 months with no records simply don't appear.",tip:"Always ORDER BY the time column after grouping by time \u2014 GROUP BY does not guarantee sort order.",analogy:"Almost every business dashboard \u2014 sales by month, signups by week, tickets by quarter \u2014 is this exact query pattern: GROUP BY strftime('%Y-%m', date). The date column has one row per event. The GROUP BY collapses events into periods. The COUNT or SUM produces the bar in the chart. The format string is the x-axis label. If you can write this query, you can build the most common chart in any business tool.",misconception:"strftime() always returns text. '%Y-%m' gives '2024-03' which sorts correctly as text. But avoid GROUP BY the alias in strict SQL \u2014 repeat the expression or use GROUP BY 1 instead."}],seeit:[{lbl:"Hiring timeline \u2014 hires per year",ann:"strftime extracts year; GROUP BY aggregates by that extracted value",sql:`SELECT
  strftime('%Y', hire_date) AS year,
  COUNT(*) AS hires
FROM employees
GROUP BY year
ORDER BY year;`},{lbl:"Employees hired since 2020",ann:"ISO dates sort as text \u2014 > works correctly on YYYY-MM-DD strings",sql:`SELECT name, hire_date,
  strftime('%Y', hire_date) AS year
FROM employees
WHERE hire_date >= '2020-01-01'
ORDER BY hire_date;`},{lbl:"Employee tenure in years",ann:"julianday subtraction gives days; dividing by 365 converts to years \u2014 ROUND keeps it readable",sql:`SELECT
  name,
  hire_date,
  ROUND((julianday('2025-01-01') - julianday(hire_date)) / 365.0, 1) AS tenure_yrs
FROM employees
ORDER BY tenure_yrs DESC;`},{lbl:"date() modifiers \u2014 relative dates",ann:"date('now') is today in UTC. Modifiers like '-1 year' shift it backward",sql:`SELECT name, hire_date FROM employees
WHERE hire_date >= date('now', '-1 year')
ORDER BY hire_date DESC;

-- More modifiers:
-- date('now', '-30 days') last 30 days
-- date('now', 'start of month') 1st of month`},{lbl:"Monthly order volume",ann:"strftime('%Y-%m') groups by year-month, giving a month-by-month revenue time series",sql:`SELECT
  strftime('%Y-%m', order_date) AS month,
  COUNT(*) AS orders,
  SUM(qty) AS units_sold
FROM orders
GROUP BY month
ORDER BY month;`}],guided:[{id:"g1",diff:"Easy",title:"Hires per year summary",context:"Operations wants to know hiring volume by year to plan future capacity. Group employees by their hire year.",template:`SELECT
  %%D:strftime|SUBSTR|LENGTH%%('%Y', hire_date) AS hire_year,
  COUNT(*) AS hires
FROM employees
GROUP BY hire_year
ORDER BY hire_year;`,checks:[{t:"rows",n:7},{t:"col",c:"hire_year"}],hints:["strftime('%Y', hire_date) extracts the 4-digit year","GROUP BY the extracted year, ORDER BY it too"],solution:"SELECT strftime('%Y', hire_date) AS hire_year, COUNT(*) AS hires FROM employees GROUP BY hire_year ORDER BY hire_year;",whyItWorks:"strftime is SQLite's versatile date formatter. '%Y' extracts the 4-digit year from any YYYY-MM-DD string. Grouping by the extracted value creates a yearly histogram."},{id:"g2",diff:"Easy",scaffold:.6,title:"Extract month and year from order dates",context:"Revenue ops needs a month-by-month summary of how many orders were placed. Use strftime to extract '%Y-%m' from order_date, group by it, and count orders.",template:`SELECT strftime('%%B:format string%%', order_date) AS month,
  COUNT(*) AS orders
FROM orders
GROUP BY month
ORDER BY month;`,checks:[{t:"rows",n:4},{t:"col",c:"month"}],hints:["Format string for year-month: '%Y-%m'","GROUP BY the extracted month string","ORDER BY month sorts chronologically because '%Y-%m' is ISO format"],solution:"SELECT strftime('%Y-%m', order_date) AS month, COUNT(*) AS orders FROM orders GROUP BY month ORDER BY month;",whyItWorks:"strftime('%Y-%m', date) produces '2024-01', '2024-02' etc. GROUP BY groups all orders from the same month together. ORDER BY month sorts chronologically because ISO year-month format sorts correctly as text."},{id:"g3",diff:"Medium",title:"Calculate employee tenure",context:"Vantara Capital needs each employee's tenure in years for a compensation benchmarking report. Use 1 January 2025 as the reference date.",template:`SELECT name, hire_date,
  ROUND((%%D:julianday|strftime|LENGTH%%('2025-01-01') - julianday(hire_date)) / %%B:divisor%%, 1) AS tenure_yrs
FROM employees
ORDER BY tenure_yrs DESC;`,checks:[{t:"rows",n:12},{t:"col",c:"tenure_yrs"}],hints:["julianday('2025-01-01') converts the reference date to days","julianday(hire_date) converts the hire date","Divide by 365.0 for years"],solution:"SELECT name, hire_date, ROUND((julianday('2025-01-01') - julianday(hire_date)) / 365.0, 1) AS tenure_yrs FROM employees ORDER BY tenure_yrs DESC;",whyItWorks:"julianday() converts any date to a continuous day count. Subtracting two values gives exact days between them. Dividing by 365.0 (not 365) ensures floating-point division for decimal years."},{id:"g4",diff:"Hard",type:"clauseorder",title:"Order the clauses of a time-series aggregation",context:"A query that extracts month from order_date, counts orders per month, and sorts the output uses a specific clause order.",clauses:["ORDER BY month","SELECT","GROUP BY month","FROM orders","WHERE order_date >= '2024-01-01'"],correctOrder:["SELECT","FROM orders","WHERE order_date >= '2024-01-01'","GROUP BY month","ORDER BY month"],hints:["SELECT defines the month alias using strftime","FROM specifies the orders table","WHERE filters before grouping","GROUP BY aggregates by the extracted month","ORDER BY sorts the final output"],whyItWorks:"WHERE runs before GROUP BY \u2014 it filters raw rows before they are aggregated. You cannot use the alias 'month' in WHERE because aliases are defined in SELECT, which logically runs after WHERE."}],usecases:[{co:"forge",icon:"\u{1F4E6}",title:"Quarterly Hiring Report",situation:"Rohan needs a quarterly hiring breakdown by year and quarter to align staffing with operational load. Each quarter should show headcount and average salary of new hires.",sql:`SELECT
  strftime('%Y', hire_date) AS year,
  CASE
    WHEN strftime('%m', hire_date) <= '03' THEN 'Q1'
    WHEN strftime('%m', hire_date) <= '06' THEN 'Q2'
    WHEN strftime('%m', hire_date) <= '09' THEN 'Q3'
    ELSE 'Q4'
  END AS quarter,
  COUNT(*) AS new_hires,
  ROUND(AVG(salary), 0) AS avg_salary
FROM employees
GROUP BY year, quarter
ORDER BY year, quarter;`,result:"7 rows showing hiring volume per year-quarter with average salary of new hires. Reveals seasonal hiring patterns.",transferPoint:"Combining strftime with CASE WHEN creates flexible time buckets. The same pattern works for fiscal quarters, academic terms, or any custom period."},{co:"nexus",icon:"\u{1F6D2}",title:"Monthly Revenue Trend",situation:"Zara needs a month-by-month order summary to identify peak sales periods and plan inventory.",sql:`SELECT
  strftime('%Y-%m', o.order_date) AS month,
  COUNT(DISTINCT o.id) AS orders,
  SUM(o.qty) AS units,
  ROUND(SUM(o.qty * p.price), 2) AS revenue
FROM orders o
JOIN products p ON p.id = o.product_id
GROUP BY month
ORDER BY month;`,result:"4 monthly rows with order count, units, and calculated revenue. Joins orders to products to compute line-item revenue.",transferPoint:"strftime('%Y-%m') is the standard month-grouping key. Always order by the time column \u2014 GROUP BY does not guarantee sort order."}],recall:[{q:"How does SQLite store dates, and why do text comparisons work on them?",opts:["As Unix timestamps \u2014 text comparison does not work","As YYYY-MM-DD text strings \u2014 ISO format sorts correctly as text","As integers (days since epoch) \u2014 comparison works numerically","As DATETIME objects \u2014 comparison uses special date logic"],ans:1,exp:"SQLite stores dates as YYYY-MM-DD text. Because ISO 8601 format always has year, then month, then day (all zero-padded), lexicographic text comparison gives the correct chronological result. '2021-03-15' < '2022-01-01' is true as text."},{q:"What does strftime('%Y-%m', order_date) return for the date '2024-03-15'?",opts:["'2024'","'03-2024'","'2024-03'","'15-03-2024'"],ans:2,exp:"strftime formats a date string according to the format argument. '%Y' is the 4-digit year, '%m' is the 2-digit month. Combined as '%Y-%m', the result is '2024-03'. This is the standard key for month-level grouping."},{q:"You want employees hired in the last 365 days. Which WHERE clause works correctly in SQLite?",opts:["WHERE hire_date = LAST_YEAR()","WHERE hire_date >= date('now', '-1 year')","WHERE hire_date >= NOW() - 365","WHERE DATEDIFF(NOW(), hire_date) <= 365"],ans:1,exp:"SQLite uses the date() function with modifiers. date('now', '-1 year') returns the date exactly one year ago from today. Comparisons on ISO date strings work correctly. DATEDIFF(), NOW(), and LAST_YEAR() are not SQLite functions."}],challenge:[{id:"c1",diff:"Hard",title:"Tenure and Hiring Cohort Report",context:"Build a complete employee timeline report: name, hire year, tenure in years (as of 2025-01-01, 1dp), a cohort label ('Founder' if hired before 2019, 'Growth' if 2019-2020, 'Scale' if 2021+), and their salary. Sort by tenure descending.",tables:["employees"],starter:`SELECT
  name,
  strftime('%Y', hire_date) AS hire_year,
  ROUND((julianday('2025-01-01') - julianday(hire_date)) / 365.0, 1) AS tenure_yrs,
  `,checks:[{t:"rows",n:12},{t:"col",c:"cohort"},{t:"col",c:"tenure_yrs"}],hints:["CASE WHEN strftime('%Y',hire_date) < '2019' THEN 'Founder'","WHEN strftime('%Y',hire_date) <= '2020' THEN 'Growth'","ELSE 'Scale' END AS cohort","ORDER BY tenure_yrs DESC"],solution:"SELECT name, strftime('%Y', hire_date) AS hire_year, ROUND((julianday('2025-01-01') - julianday(hire_date)) / 365.0, 1) AS tenure_yrs, CASE WHEN strftime('%Y', hire_date) < '2019' THEN 'Founder' WHEN strftime('%Y', hire_date) <= '2020' THEN 'Growth' ELSE 'Scale' END AS cohort, salary FROM employees ORDER BY tenure_yrs DESC;",celebration:"strftime, julianday, ROUND, and CASE WHEN \u2014 you just built a cohort analysis that HR teams pay consultants to produce. Every analyst needs this pattern."}],sheet:{syntax:[{label:"Extract parts",code:`strftime('%Y', hire_date)    -- year
strftime('%m', hire_date)    -- month
strftime('%Y-%m', hire_date) -- group by month`},{label:"Date arithmetic",code:`julianday('now') - julianday(hire_date)
  AS days_employed`},{label:"Filter by date",code:`WHERE hire_date >= '2020-01-01'
WHERE hire_date BETWEEN '2020-01-01'
              AND '2020-12-31'`}],rules:[{icon:"\u{1F4C5}",text:"SQLite stores dates as TEXT in ISO format YYYY-MM-DD. ISO format sorts correctly as plain text \u2014 no conversion needed for ORDER BY."},{icon:"\u26A1",text:"strftime() always returns TEXT \u2014 use CAST(strftime('%Y', date) AS INTEGER) when you need a number for arithmetic."},{icon:"\u{1F522}",text:"julianday() converts any date to a decimal number of days \u2014 subtract two julianday results to get the days between them."}],gotcha:"strftime('%Y', hire_date) returns '2024' as TEXT, not 2024 as INTEGER. Grouping works fine, but arithmetic like year + 1 requires CAST()."}}]},{level:"Advanced",icon:"\u26A1",color:"#FF6B8A",modules:[{id:"a1",mins:22,title:"Window Functions",tagline:"Rank, compare, and aggregate across rows \u2014 without losing any of them.",hook:{co:"atlas",from:"Camila Ibarra \xB7 Head of Finance",day:"Mon 09:14",msg:"Can you add a salary rank column for each employee within their department? And their department average alongside? Without collapsing the rows into groups?",insight:"Window functions compute across related rows while preserving every individual row in the output \u2014 the thing GROUP BY cannot do. They unlock ranking, running totals, and row-by-row comparisons."},concepts:[{icon:"\u{1FA9F}",title:"OVER() \u2014 the window clause",body:"Window functions compute a value for each row based on a set of related rows defined by OVER(). Unlike GROUP BY, they never collapse rows \u2014 every input row produces one output row with the new computed column alongside the original columns. OVER() with no arguments uses the entire result set. OVER(PARTITION BY dept_id) creates an independent window per department. OVER(ORDER BY salary DESC) ranks rows in salary order. PARTITION BY and ORDER BY can appear together inside the same OVER().",analogy:"The moment you reach for a window function is usually: 'I want each row to know something about all the other rows.' Each sale should know its rank among all sales. Each employee should see their salary next to the department average. With GROUP BY you'd lose the individual rows. With a self-join you'd need to join the table against itself. OVER() is the clean solution: one query, all rows preserved, new column added.",tip:"Window functions never reduce row count. That's the critical difference from GROUP BY."},{icon:"\u{1F3C6}",title:"RANK(), ROW_NUMBER(), DENSE_RANK()",body:"ROW_NUMBER() assigns unique sequential integers 1, 2, 3... even when rows are tied \u2014 ties get arbitrary but distinct numbers. RANK() assigns tied rows the same rank, then skips: ranks 1, 2, 2, 4 with no rank 3 after the tie. DENSE_RANK() assigns the same rank to ties without skipping: 1, 2, 2, 3. Choose based on context: pagination usually needs ROW_NUMBER for stable unique positions; leaderboards and competition results usually need RANK or DENSE_RANK to represent ties correctly.",tip:"Use ROW_NUMBER() to pick exactly one row per group. Use RANK() when ties should share a position."},{icon:"\u{1F4CA}",title:"PARTITION BY and ORDER BY inside OVER()",body:"PARTITION BY in OVER() divides rows into independent windows without collapsing them \u2014 like GROUP BY but preserving every row. RANK() OVER(PARTITION BY dept_id ORDER BY salary DESC) ranks employees by salary within each department, restarting at 1 for each department. ORDER BY inside OVER() controls processing order within each partition for ranking and offset functions \u2014 it is independent of the query's outer ORDER BY, which only controls the final output sequence.",misconception:"ORDER BY inside OVER() is separate from the query's final ORDER BY. One controls computation; the other controls output row order."},{icon:"\u{1F6AB}",title:"Where window functions cannot go",body:"Window functions are evaluated in the SELECT phase. WHERE, GROUP BY, and HAVING execute before SELECT, so they cannot reference window function results. Placing RANK() in a WHERE clause causes a syntax error. The solution: wrap the windowed query in a CTE or subquery. WITH ranked AS (SELECT *, ROW_NUMBER() OVER(PARTITION BY dept_id ORDER BY salary DESC) AS rn FROM employees) SELECT * FROM ranked WHERE rn = 1 \u2014 filters on rn happen after the window function has been computed.",analogy:"Window functions live inside SELECT \u2014 they produce a new column by looking across the result set. But WHERE, GROUP BY, and HAVING run before SELECT. Trying to filter with a window function in WHERE is like a teacher trying to fail students for scoring below the class average before she's finished marking the exams. The average doesn't exist yet. The window result doesn't exist yet either.",tip:"Full execution order: FROM \u2192 WHERE \u2192 GROUP BY \u2192 HAVING \u2192 SELECT (window functions here) \u2192 ORDER BY.",misconception:"PARTITION BY is not GROUP BY. GROUP BY collapses many rows into one row per group and loses individual records. PARTITION BY keeps all rows but adds a window computation column alongside each."},{icon:"\u2194\uFE0F",title:"LAG() and LEAD()",body:"LAG(col, n, default) returns the value of col from n rows before the current row within the window. LEAD(col, n, default) returns the value n rows ahead. Both default to n=1. The optional third argument specifies a fallback when no prior or next row exists \u2014 for example, at the start or end of a partition. LAG(revenue) OVER(ORDER BY month) placed alongside revenue in SELECT gives this month's and last month's figures in the same row without any self-join.",tip:"LAG(col) returns NULL for the first row (no previous row exists). Use COALESCE(LAG(col) OVER(...), 0) if you want 0 instead of NULL for the first row."}],seeit:[{lbl:"Rank employees by salary within department",ann:"RANK() with PARTITION BY resets the counter for each department group",sql:`SELECT name, dept_id, salary,
  RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS dept_rank
FROM employees
ORDER BY dept_id, dept_rank;`},{lbl:"Department average alongside each employee row",ann:"AVG() as a window function keeps all 12 rows \u2014 unlike GROUP BY which collapses to 5",sql:`SELECT name, dept_id, salary,
  ROUND(AVG(salary) OVER (PARTITION BY dept_id), 0) AS dept_avg,
  salary - ROUND(AVG(salary) OVER (PARTITION BY dept_id), 0) AS vs_avg
FROM employees
ORDER BY dept_id, salary DESC;`},{lbl:"ROW_NUMBER \u2014 pick top earner per department",ann:"Subquery assigns rn=1 to the top earner; outer WHERE filters to just those rows",sql:`SELECT * FROM (
  SELECT name, dept_id, salary,
    ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rn
  FROM employees
) t
WHERE rn = 1;`},{lbl:"SUM() OVER \u2014 cumulative running total",ann:"SUM() OVER with ORDER BY builds a cumulative total \u2014 each row adds to all previous rows",sql:`SELECT o.id, o.order_date,
  ROUND(o.qty * p.price, 2) AS revenue,
  ROUND(SUM(o.qty * p.price)
    OVER (ORDER BY o.order_date), 2) AS running_total
FROM orders o
JOIN products p ON o.product_id = p.id
ORDER BY o.order_date;`},{lbl:"LAG \u2014 compare each employee to the previous hire",ann:"LAG() returns NULL for the first row (no previous row). COALESCE shows 0 diff for the oldest hire.",sql:`SELECT name, hire_date, salary,
  LAG(salary) OVER (ORDER BY hire_date) AS prev_salary,
  salary - COALESCE(LAG(salary) OVER (ORDER BY hire_date), salary) AS diff
FROM employees
ORDER BY hire_date;`}],guided:[{id:"g1",diff:"Easy",title:"Rank all employees by salary company-wide",context:"Show each employee's name, salary, and their global salary rank. Highest earner = rank 1.",template:`SELECT name, salary,
  %%D:RANK|ROW_NUMBER|DENSE_RANK%%()
    OVER (ORDER BY salary %%D:DESC|ASC%%) AS salary_rank
FROM employees
